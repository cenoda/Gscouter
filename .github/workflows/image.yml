name: image

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # TestSlimTableCurrent compares the embedded small table with
      # teams/weights.json, an LFS file (about 17 MB). LFS bandwidth is
      # metered, so the object is cached under its object id and
      # downloaded only when the table changes; git lfs pull then takes
      # it from .git/lfs. Restore and save are separate steps so that the
      # cache is saved even when a later step fails.
      - name: list LFS objects
        run: git lfs ls-files -l | cut -d ' ' -f 1 | sort > .lfs-objects
      - id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-objects') }}
      - name: git lfs pull
        run: |
          # Say which objects the cache held, so the log shows whether
          # this run downloaded anything.
          while read -r oid; do
            if [ -f ".git/lfs/objects/${oid:0:2}/${oid:2:2}/$oid" ]; then
              echo "LFS object $oid: from cache"
            else
              echo "LFS object $oid: downloading"
            fi
          done < .lfs-objects
          git lfs pull
          if head -c 100 teams/weights.json | grep -q '^version https://git-lfs'; then
            echo "teams/weights.json is still an LFS pointer"
            exit 1
          fi
      - if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs-cache.outputs.cache-primary-key }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # GSCOUTER_REQUIRE_LFS makes TestSlimTableCurrent fail, not skip,
      # without the full table.
      - run: go test ./...
        env:
          GSCOUTER_REQUIRE_LFS: '1'
      - name: slim table matches teams/weights.json
        env:
          GSCOUTER_REQUIRE_LFS: '1'
        run: go test -count=1 -v -run '^TestSlimTableCurrent$' ./internal/weights
      - name: browser build
        run: GOOS=js GOARCH=wasm go vet ./cmd/wasm && GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/wasm
      # Fully validate the teams this push or pull request changes; with
      # none, 10 random teams. A bulk change (a harvest, validated in full
      # locally) is sampled: 30 of its teams.
      - name: validate changed teams
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          dirs=""
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            for d in $(git diff --name-only "$BASE" HEAD -- teams/ | awk -F/ 'NF > 2 { print $1 "/" $2 }' | sort -u); do
              [ -f "$d/team.yaml" ] && dirs="$dirs $d"
            done
          fi
          if [ -z "$dirs" ]; then
            dirs=$(ls -d teams/*/ | shuf -n 10)
          else
            dirs=$(printf '%s\n' $dirs | shuf -n 30)
          fi
          go run ./cmd/validate -iter 50 $dirs

  # Pull requests build the image too, to catch a broken Dockerfile, but
  # only pushes to main publish it.
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/cenoda/gscouter:latest
            ghcr.io/cenoda/gscouter:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

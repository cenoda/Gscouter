# Runs on the VM. The update timer (see cloud-init.yaml) re-downloads this
# file from main, so changes here deploy themselves.
services:
  gscouter:
    image: ghcr.io/cenoda/gscouter:latest
    restart: unless-stopped
    mem_limit: 600m
    environment:
      GSCOUTER_LINKS: /data/links.db
      GSCOUTER_SITE: https://${DOMAIN}
      GSCOUTER_INDEXNOW: /data/indexnow.json
    volumes:
      # Short links (/s/...) and the IndexNow state, kept across updates.
      - links:/data
    depends_on:
      links-owner:
        condition: service_completed_successfully

  # Gives the short links volume to the app's nonroot user (UID 65532),
  # whose image has no shell to do it.
  links-owner:
    image: busybox:1.37
    command: chown 65532:65532 /data
    volumes:
      - links:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      OLD_DOMAINS: ${OLD_DOMAINS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  links:
  caddy_data:
  caddy_config:

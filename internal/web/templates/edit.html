{{template "head" (t "ed.title")}}
<style>
/* The chart editor (docs/cycle-swap.md §6): lanes on top, the game's controls below, or beside them on a phone held sideways. */
.ed { display: grid; gap: 12px; }
.ed-head { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.ed-head h1 { font-size: 1.15rem; margin: 0; }
.ed-scores { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.ed-sc { display: grid; }
.ed-sc span { font-size: .75rem; color: var(--muted); }
.ed-sc b { font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.ed-chart { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.ed-labels { flex: none; width: 58px; border-right: 1px solid var(--line); }
.ed-ruler { height: var(--ruler, 46px); border-bottom: 1px solid var(--line); }
.ed-lane { height: var(--lane, 64px); display: flex; align-items: center; justify-content: center; }
.ed-lane .face { width: 40px; height: 40px; }
.ed-scroll { overflow-x: auto; flex: 1; min-width: 0; }
.ed-svg { display: block; touch-action: pan-x; user-select: none; -webkit-user-select: none; font-family: inherit; }
.ed-svg .tick { font-size: 11px; fill: var(--muted); }
.ed-svg .grid { stroke: var(--line); } .ed-svg .minor { stroke-opacity: .5; }
.ed-svg .track { stroke: var(--line); stroke-width: 2; }
.ed-svg .f0 { fill: var(--s0); } .ed-svg .f1 { fill: var(--s1); } .ed-svg .f2 { fill: var(--s2); } .ed-svg .f3 { fill: var(--s3); }
.ed-svg .k0 { stroke: var(--s0); } .ed-svg .k1 { stroke: var(--s1); } .ed-svg .k2 { stroke: var(--s2); } .ed-svg .k3 { stroke: var(--s3); }
.ed-svg .field { fill-opacity: .16; }
.ed-svg .cd { fill-opacity: .3; }
.ed-svg .en { fill: none; stroke-width: 1.5; stroke-opacity: .8; }
.ed-svg .note { cursor: grab; }
.ed-svg .note .body { fill: var(--card); stroke-width: 2.5; }
.ed-svg .note text { font-size: 11px; font-weight: 700; fill: var(--text); text-anchor: middle; pointer-events: none; }
.ed-svg .note.ready .body { stroke-dasharray: 3 2.5; }
.ed-svg .note.skipped { opacity: .32; }
.ed-svg .note.ghost { opacity: .38; pointer-events: none; }
.ed-svg .note .halo { fill: transparent; }
.ed-svg .note.sel .halo { fill: var(--accent); fill-opacity: .18; stroke: var(--accent); stroke-width: 1.5; }
.ed-svg .note.bad .halo { fill: var(--bad-bg); stroke: var(--bad); stroke-width: 2; }
.ed-svg .wait-auto { fill: url(#ed-hatch-warn); }
.ed-svg .wait-user { fill: url(#ed-hatch-user); }
.ed-svg .wl { font-size: 9.5px; fill: var(--muted); text-anchor: middle; }
.ed-svg .cyc { stroke: var(--muted); stroke-dasharray: 4 4; stroke-opacity: .6; }
.ed-svg .cyc-l { font-size: 11px; fill: var(--muted); font-weight: 600; }
.ed-svg .rep { fill: none; stroke: var(--gold); stroke-width: 2; }
.ed-svg .rep-l { font-size: 11px; font-weight: 700; fill: var(--gold); }
.ed-svg .ph { stroke: var(--accent); stroke-width: 2; } .ed-svg .ph-cap { fill: var(--accent); }
.ed-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 36px; }
.ed-tools .lbl { font-size: .85rem; color: var(--muted); margin-right: 4px; }
.ed-chip { padding: 6px 11px; border-radius: 999px; background: var(--accent-soft); color: var(--text); font-size: .85rem; font-weight: 500; border: 1px solid transparent; }
.ed-chip.on { background: var(--card); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.ed-chip.danger { color: var(--bad); }
.ed-seg { display: inline-flex; border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.ed-seg button { padding: 5px 11px; background: transparent; color: var(--muted); font-size: .85rem; font-weight: 500; border-radius: 0; }
.ed-seg button.on { background: var(--accent); color: var(--on-accent); }
.ed-msg { margin: 0; font-size: .85rem; }
.ed-msg.bad { color: var(--bad); }
.ed-hudwrap { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; }
.ed-side { display: grid; gap: 8px; align-content: end; min-width: 0; }
.ed-side .row { display: flex; gap: 8px; flex-wrap: wrap; }
.ed-side .row button { padding: 7px 12px; font-size: .9rem; }
.ed-hud { display: grid; grid-template-columns: auto auto; gap: 14px; align-items: end; }
.ed-pad { display: grid; grid-template-columns: repeat(3, auto); gap: 8px; justify-items: center; align-items: center; }
.ed-key { position: relative; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--text); border: 2px solid var(--line); font-weight: 700; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
.ed-key.down { transform: scale(.94); background: var(--card); border-color: var(--accent); }
.ed-key small { display: block; font-size: 9px; font-weight: 500; color: var(--muted); line-height: 1.1; }
.ed-key .kb { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 600; padding: 0 5px; border-radius: 4px; background: var(--card); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.ed-key.atk { width: 76px; height: 76px; grid-column: 3; grid-row: 2 / span 2; }
.ed-key.e { width: 58px; height: 58px; grid-column: 2; grid-row: 3; }
.ed-key.q { width: 62px; height: 62px; grid-column: 3; grid-row: 1; }
.ed-key.dash { width: 46px; height: 46px; font-size: .8rem; grid-column: 2; grid-row: 2; }
.ed-key.jump { width: 46px; height: 46px; font-size: .8rem; grid-column: 1; grid-row: 3; }
.ed-key.plunge { width: 46px; height: 46px; font-size: .75rem; grid-column: 1; grid-row: 2; }
.ed-party { display: grid; gap: 8px; justify-items: stretch; }
.ed-party .ed-pm { justify-self: start; }
.ed-pm { display: flex; align-items: center; gap: 8px; padding: 3px 10px 3px 3px; border-radius: 999px; background: var(--accent-soft); color: var(--text); border: 2px solid transparent; font-weight: 500; font-size: .85rem; }
.ed-pm.on { border-color: var(--accent); background: var(--card); }
.ed-pm .face { width: 32px; height: 32px; }
.ed-pm .kb { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.ed-toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: .85rem; max-width: calc(100% - 32px); z-index: 20; }
.ed-kbd { display: none; }
@media (hover: hover) and (pointer: fine) { .ed-kbd { display: inline; } }
@media (hover: none) { .ed-key .kb, .ed-pm .kb { display: none; } }
@media (max-width: 640px) {
  .ed-hudwrap { grid-template-columns: 1fr; }
  .ed-pm span:not(.kb) { display: none; } .ed-pm { padding: 3px; }
}
/* A phone held sideways: chart on the left, the game's controls on the right. */
@media (orientation: landscape) and (max-height: 500px) {
  .ed { grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
  .ed > .ed-headcard { grid-column: 1 / -1; padding: 6px 12px; }
  .ed-head { flex-wrap: nowrap; } .ed-head h1 { font-size: 1rem; white-space: nowrap; }
  .ed .card { padding: 8px 10px; margin: 0; }
  .ed-labels { width: 46px; } .ed-lane .face { width: 32px; height: 32px; }
  #ed-help, .ed-side .help, .ed-saves { display: none; }
  .ed-hudwrap { grid-template-columns: 1fr; gap: 6px; }
  .ed-side { order: 2; }
  .ed-side .row button { padding: 4px 8px; font-size: .75rem; }
  .ed-key.atk { width: 64px; height: 64px; } .ed-key.e { width: 50px; height: 50px; } .ed-key.q { width: 52px; height: 52px; }
  .ed-key.dash, .ed-key.jump, .ed-key.plunge { width: 40px; height: 40px; font-size: .72rem; }
  .ed-key small { display: none; } .ed-pad { gap: 6px; } .ed-party { gap: 5px; }
  .ed-pm { padding: 2px; } .ed-pm span:not(.kb) { display: none; } .ed-pm .face { width: 34px; height: 34px; }
}
.ed-face { position: relative; padding: 0; border-radius: 50%; background: none; }
.ed-face .dot { position: absolute; right: -2px; top: -2px; width: 11px; height: 11px; border-radius: 50%; background: var(--gold); border: 2px solid var(--card); }
.ed-face .gear { position: absolute; right: -4px; bottom: -4px; width: 16px; height: 16px; border-radius: 50%; background: var(--card); color: var(--muted); font-size: 10px; line-height: 14px; border: 1px solid var(--line); }
.ed-saves { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.ed-saves select, .ed-saves input { font: inherit; font-size: .9rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--text); min-width: 0; }
.ed-saves input { width: 12em; }
.ed-saves [hidden] { display: none; }
.ed-saves button { padding: 6px 12px; font-size: .9rem; }
.ed-sheet-bg { position: fixed; inset: 0; background: rgba(10,12,20,.35); z-index: 30; display: grid; place-items: center; padding: 16px; }
.ed-sheet { background: var(--card); border: 1px solid var(--line); border-radius: 10px; width: min(380px, 100%); padding: 16px; display: grid; gap: 14px; }
.ed-sheet h2 { margin: 0; font-size: 1rem; display: flex; align-items: center; gap: 10px; }
.ed-sheet h2 .face { width: 32px; height: 32px; }
.ed-param { display: grid; gap: 4px; }
.ed-param label { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; }
.ed-param label b { font-variant-numeric: tabular-nums; font-weight: 600; }
.ed-param input[type=range] { width: 100%; accent-color: var(--accent); }
.ed-param input[type=number] { font: inherit; width: 7em; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--text); }
.ed-param .def { font-size: .75rem; color: var(--muted); }
.ed-sheet .row { display: flex; justify-content: space-between; gap: 8px; }
@media (max-width: 640px) {
  .ed-sheet-bg { place-items: end center; padding: 0; }
  .ed-sheet { border-radius: 14px 14px 0 0; width: 100%; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .ed-key.down { transform: none; } }
</style>

<div class="ed">
<div class="card ed-headcard">
<div class="ed-head">
<div><h1>{{teamName .Team.Team}}</h1><span class="muted">{{t "ed.title"}}</span></div>
<div class="ed-scores">
<div class="ed-sc"><span>{{t "ed.preview_dps"}}</span><b id="ed-dps">–</b></div>
<a class="button secondary" href="{{.Score}}">{{t "ed.back"}}</a>
<button type="button" id="ed-score" disabled>{{t "ed.score"}}</button>
</div>
</div>
<div class="ed-saves">
<select id="ed-saved" aria-label="{{t "ed.saved_charts"}}"><option value="">{{t "ed.saved_charts"}}</option></select>
<input type="text" id="ed-name" maxlength="40" placeholder="{{t "ed.chart_name"}}" aria-label="{{t "ed.chart_name"}}">
<button type="button" class="secondary" id="ed-save">{{t "ed.save"}}</button>
<button type="button" class="secondary" id="ed-unsave" hidden>{{t "ed.delete_saved"}}</button>
</div>
</div>

<div class="card" style="display:grid; gap:10px; margin:0">
<div class="ed-chart">
<div class="ed-labels" id="ed-labels"><div class="ed-ruler"></div>{{range $i, $m := .Members}}<div class="ed-lane"><button type="button" class="ed-face" data-p="{{$i}}" aria-label="{{t "ed.params_title" (name $m.Key)}}">{{template "face" $m.Key}}<span class="gear" aria-hidden="true">⚙</span></button></div>{{end}}</div>
<div class="ed-scroll" id="ed-scroll"><svg class="ed-svg" id="ed-svg" role="img" aria-label="{{t "ed.title"}}"></svg></div>
</div>
<div class="ed-tools" id="ed-tools"></div>
<p class="ed-msg muted" id="ed-msg">{{t "ed.loading"}}</p>
</div>

<div class="card ed-hudwrap" style="margin:0">
<div class="ed-side">
<div class="row">
<button type="button" class="secondary" id="ed-undo">{{t "ed.undo"}}</button>
<button type="button" class="secondary" id="ed-end">{{t "ed.to_end"}}</button>
<button type="button" class="secondary" id="ed-wait">{{t "ed.wait"}}</button>
<button type="button" class="secondary" id="ed-reset">{{t "ed.reset"}}</button>
</div>
<p class="muted help" style="margin:0; font-size:.85rem">{{t "ed.help"}}<span class="ed-kbd"> {{t "ed.keys"}}</span></p>
</div>
<div class="ed-hud">
<div class="ed-pad" id="ed-pad">
<button type="button" class="ed-key q" data-a="burst" aria-label="{{t "tl.burst"}}">Q<span class="kb">Q</span></button>
<button type="button" class="ed-key plunge" data-a="high_plunge">{{t "ed.plunge"}}<span class="kb">X</span></button>
<button type="button" class="ed-key dash" data-a="dash">{{t "ed.dash"}}<span class="kb">Shift</span></button>
<button type="button" class="ed-key atk" data-a="attack">{{t "ed.attack"}}<small>{{t "ed.hold_charge"}}</small><span class="kb">Z</span></button>
<button type="button" class="ed-key jump" data-a="jump">{{t "ed.jump"}}<span class="kb">Space</span></button>
<button type="button" class="ed-key e" data-a="skill" aria-label="{{t "tl.skill"}}">E<small>{{t "ed.hold_skill"}}</small><span class="kb">E</span></button>
</div>
<div class="ed-party" id="ed-party">{{range $i, $m := .Members}}<button type="button" class="ed-pm" data-sw="{{$i}}">{{template "face" $m.Key}}<span>{{name $m.Key}}</span><span class="kb">{{inc $i}}</span></button>{{end}}</div>
</div>
</div>
</div>
<div id="ed-layer"></div>

<script>
// The chart editor (docs/cycle-swap.md): a chart is notes in order, and
// gcsim, in a worker, plays it to place them (chart.Preview).
(function () {
  var V = {{.Version}}, BUILD = {{.Build}}, ROTATION = {{.Rotation}}, SCORE = {{.Score}};
  var NAMES = JSON.stringify({{.Names}}), DEFAULTS = JSON.stringify({{.Defaults}});
  var START = {{.Chart}};
  var TEMPLATE = {{with .Template}}{name: {{teamName .}}, rotation: {{.Rotation}}}{{else}}null{{end}};
  var TEMPLATE_BUILD = {{.TemplateBuild}}, TEMPLATE_NAMES = JSON.stringify({{.TemplateNames}}), MOVES = JSON.stringify({{.Moves}});
  var CHARS = [{{range $i, $m := .Members}}{{if $i}}, {{end}}{{name $m.Key}}{{end}}];
  var S = {
    loading: {{t "ed.loading"}}, recording: {{t "ed.recording"}}, select: {{t "ed.select"}},
    playheadEnd: {{t "ed.playhead_end"}}, playheadAt: {{t "ed.playhead_at"}},
    tap: {{t "ed.tap"}}, hold: {{t "ed.hold"}}, ready: {{t "ed.ready"}}, clearWait: {{t "ed.clear_wait"}},
    before: {{t "ed.before"}}, range: {{t "ed.range"}}, del: {{t "ed.delete"}}, selected: {{t "ed.selected"}},
    passEdit: {{t "ed.pass_edit"}}, passPreview: {{t "ed.pass_preview"}}, ghost: {{t "ed.ghost"}},
    failed: {{t "ed.failed"}}, notEarlier: {{t "ed.not_earlier"}}, prevEnd: {{t "ed.prev_end"}}, nothingUndo: {{t "ed.nothing_undo"}},
    pickNote: {{t "ed.pick_note"}}, pickEnd: {{t "ed.pick_end"}}, repeatHint: {{t "ed.repeat_hint"}}, readyHint: {{t "ed.ready_hint"}}, dragHint: {{t "ed.drag_hint"}},
    broken: {{t "ed.broken"}}, recordFailed: {{t "ed.record_failed"}}, template: {{t "ed.template"}}, blank: {{t "ed.blank"}},
    paramsTitle: {{t "ed.params_title"}}, startHP: {{t "ed.start_hp"}}, startEnergy: {{t "ed.start_energy"}}, paramDefault: {{t "ed.param_default"}},
    paramsNote: {{t "ed.params_note"}}, resetParams: {{t "ed.reset_params"}}, close: {{t "ed.close"}},
    savedMsg: {{t "ed.saved_msg"}}, nameFirst: {{t "ed.name_first"}},
    reasons: {insufficient_energy: {{t "wait.insufficient_energy"}}, skill_cd: {{t "wait.skill_cd"}}, burst_cd: {{t "wait.burst_cd"}}, insufficient_stamina: {{t "wait.insufficient_stamina"}}},
    actions: {attack: {{t "ed.attack"}}, charge: {{t "ed.charge"}}, skill: {{t "tl.skill"}}, burst: {{t "tl.burst"}}, dash: {{t "ed.dash"}}, jump: {{t "ed.jump"}}, high_plunge: {{t "ed.plunge"}}, low_plunge: {{t "ed.plunge"}}, aim: {{t "ed.aim"}}, walk: {{t "ed.walk"}}}
  };
  var CODES = {N: "attack", C: "charge", E: "skill", Q: "burst", A: "aim", H: "high_plunge", L: "low_plunge", D: "dash", J: "jump", W: "walk"};
  var CODE_OF = {}; for (var k in CODES) CODE_OF[CODES[k]] = k;
  var PX = 46, RULER = 46, LANE = 64, HOLD_MS = 320;
  var wide = window.matchMedia ? matchMedia("(orientation: landscape) and (max-height: 500px)") : {matches: false};
  function sizes() {
    RULER = wide.matches ? 34 : 46; LANE = wide.matches ? 46 : 64;
    document.documentElement.style.setProperty("--lane", LANE + "px");
    document.documentElement.style.setProperty("--ruler", RULER + "px");
  }
  sizes();
  if (wide.addEventListener) wide.addEventListener("change", function () { sizes(); render(); });

  // ---- The text form (internal/chart): parse and write ----
  function parse(text) {
    var halves = text.split(";"), notes = [], repeats = [], params = [[], [], [], []], open = -1, wait = 0;
    halves[0].split(/\s+/).filter(Boolean).forEach(function (tok) {
      if (tok[0] === "[") { open = notes.length; tok = tok.slice(1); if (!tok) return; }
      if (tok[0] === "~") { wait += +tok.slice(1); return; }
      var close = null, i = tok.indexOf("]");
      if (i >= 0) { close = +tok.slice(i + 1); tok = tok.slice(0, i); }
      if (tok) {
        var m = /^(\d)([A-Z])(?:\(([^)]*)\))?(\?)?$/.exec(tok);
        if (!m) throw new Error("bad note " + tok);
        notes.push({s: +m[1], a: CODES[m[2]], p: m[3] ? m[3].split(",").map(function (kv) { var x = kv.split("="); return [x[0], +x[1]]; }) : [], r: !!m[4], w: wait});
        wait = 0;
      }
      if (close !== null) { repeats.push({from: open, to: notes.length - 1, times: close}); open = -1; }
    });
    halves.slice(1).forEach(function (part) {
      var f = part.trim().split(/\s+/).filter(Boolean);
      if (!f.length) return;
      params[+f[0].slice(1)] = f.slice(1).map(function (kv) { var x = kv.split("="); return [x[0], +x[1]]; });
    });
    return {notes: notes, repeats: repeats, params: params};
  }
  function write(st) {
    var toks = [];
    st.notes.forEach(function (n, i) {
      var open = st.repeats.some(function (r) { return r.from === i; });
      if (n.w > 0) { toks.push((open ? "[" : "") + "~" + n.w); open = false; }
      var t = (open ? "[" : "") + n.s + CODE_OF[n.a];
      if (n.p.length) t += "(" + n.p.map(function (p) { return p[0] + "=" + p[1]; }).join(",") + ")";
      if (n.r) t += "?";
      st.repeats.forEach(function (r) { if (r.to === i) t += "]" + r.times; });
      toks.push(t);
    });
    st.params.forEach(function (ps, s) {
      if (ps.length) toks.push("; p" + s + " " + ps.map(function (p) { return p[0] + "=" + p[1]; }).join(" "));
    });
    return toks.join(" ");
  }

  // ---- The engine, in a worker ----
  var worker, calls = {}, nextCall = 0, ready;
  function call(fn, args) {
    return ready.then(function () {
      return new Promise(function (resolve, reject) {
        var id = nextCall++;
        calls[id] = {resolve: resolve, reject: reject};
        worker.postMessage({type: "call", id: id, fn: fn, args: args});
      });
    });
  }
  function boot() {
    var wasm = "/static/gscouter.wasm?v=" + V;
    var compile = WebAssembly.compileStreaming ? WebAssembly.compileStreaming(fetch(wasm)) : fetch(wasm).then(function (r) { return r.arrayBuffer(); }).then(WebAssembly.compile);
    ready = compile.then(function (module) {
      return new Promise(function (resolve, reject) {
        worker = new Worker("/static/worker.js?v=" + V);
        worker.onmessage = function (e) {
          var m = e.data;
          if (m.type === "ready") return resolve();
          if (m.type === "error") return reject(new Error(m.error));
          if (m.type === "call") {
            var c = calls[m.id]; delete calls[m.id];
            if (m.error) c.reject(new Error(m.error)); else c.resolve(m.result);
          }
        };
        worker.postMessage({type: "init", module: module});
      });
    });
  }

  // ---- State ----
  var st = null, P = null, undoStack = [], cursor = 0, sel = null, rangeEnd = null, rangeMode = false, active = 0;
  var store = "gscouter.chart:" + JSON.parse(NAMES).join(",");
  var $ = function (id) { return document.getElementById(id); };
  // notice is what the chart started from, shown until the first edit.
  var notice = "";
  function snapshot() { notice = ""; undoStack.push(write(st)); if (undoStack.length > 100) undoStack.shift(); }
  function undo() {
    var h = undoStack.pop();
    if (!h) return toast(S.nothingUndo);
    st = parse(h); cursor = Math.min(cursor, st.notes.length); sel = null; rangeEnd = null; changed();
  }
  var previewTimer = 0, urlTimer = 0, previewing = 0;
  function changed() {
    render();
    clearTimeout(previewTimer);
    previewTimer = setTimeout(runPreview, 120);
    clearTimeout(urlTimer);
    urlTimer = setTimeout(syncURL, 600);
    try { localStorage.setItem(store, write(st)); } catch (e) {}
  }
  function runPreview() {
    if (!st.notes.length) { P = null; render(); return; }
    var mine = ++previewing;
    call("preview", [BUILD, write(st), NAMES, DEFAULTS]).then(function (json) {
      if (mine !== previewing) return;
      P = JSON.parse(json);
      render();
    }, function (err) {
      if (mine !== previewing) return;
      P = null; render(); message(S.broken.replace("%s", err.message), true);
    });
  }
  function syncURL() {
    if (!st.notes.length) return;
    call("encode", [write(st)]).then(function (c) {

  function labels() {
    document.querySelectorAll("#ed-labels [data-p]").forEach(function (b) {
      var s = +b.dataset.p, dot = b.querySelector(".dot"), on = st && st.params[s].length > 0;
      if (on && !dot) { dot = document.createElement("span"); dot.className = "dot"; b.appendChild(dot); }
      if (!on && dot) dot.remove();
    });
  }
  function openSheet(s) {
    var face = document.querySelector('#ed-labels [data-p="' + s + '"] img');
    var h = '<div class="ed-sheet-bg" id="ed-sheet-bg"><div class="ed-sheet" role="dialog" aria-modal="true" aria-label="' + esc(S.paramsTitle.replace("%s", CHARS[s])) + '"><h2>' + (face ? face.outerHTML : "") + esc(S.paramsTitle.replace("%s", CHARS[s])) + '</h2>';
    paramsFor(s).forEach(function (p) {
      var v = paramValue(s, p.k), def = DEFS[s][p.k], shown = v !== undefined ? v : def !== undefined ? def : p.base, id = "ed-p-" + s + "-" + p.k.replace(/\W/g, "_");
      var defLine = def !== undefined ? '<span class="def">' + esc(S.paramDefault.replace("%s", def + (p.unit || ""))) + '</span>' : "";
      if (p.bool) {
        h += '<div class="ed-param"><label for="' + id + '"><span>' + esc(p.label || p.k) + '</span><input type="checkbox" id="' + id + '" data-k="' + p.k + '"' + (shown ? " checked" : "") + '></label>' + defLine + '</div>';
      } else if (p.number) {
        h += '<div class="ed-param"><label for="' + id + '"><span>' + esc(p.k) + '</span><input type="number" id="' + id + '" data-k="' + p.k + '" value="' + shown + '"></label>' + defLine + '</div>';
      } else {
        h += '<div class="ed-param"><label for="' + id + '"><span>' + esc(p.label || p.k) + '</span><b>' + shown + (p.unit || "") + '</b></label><input type="range" id="' + id + '" data-k="' + p.k + '" min="' + p.min + '" max="' + p.max + '" value="' + shown + '">' + defLine + '</div>';
      }
    });
    h += '<p class="muted" style="margin:0;font-size:.8rem">' + esc(S.paramsNote) + '</p><div class="row"><button type="button" class="secondary" id="ed-p-reset">' + esc(S.resetParams) + '</button><button type="button" id="ed-p-close">' + esc(S.close) + '</button></div></div></div>';
    var layer = $("ed-layer");
    layer.innerHTML = h;
    var touched = false;
    layer.querySelectorAll("input").forEach(function (inp) {
      inp.addEventListener("input", function () {
        if (!touched) { snapshot(); touched = true; }
        var k = inp.dataset.k, v = inp.type === "checkbox" ? (inp.checked ? 1 : 0) : Math.round(+inp.value);
        st.params[s] = st.params[s].filter(function (p) { return p[0] !== k; });
        st.params[s].push([k, v]);
        var b = inp.closest(".ed-param").querySelector("b");
        if (b) b.textContent = inp.value + (k === "start_hp%" ? "%" : "");
        labels();
      });
      inp.addEventListener("change", changed);
    });
    $("ed-p-reset").onclick = function () { snapshot(); st.params[s] = []; changed(); openSheet(s); };
    $("ed-p-close").onclick = closeSheet;
    $("ed-sheet-bg").addEventListener("click", function (e) { if (e.target.id === "ed-sheet-bg") closeSheet(); });
    $("ed-p-close").focus();
  }
  function closeSheet() { $("ed-layer").innerHTML = ""; }
  $("ed-labels").addEventListener("click", function (e) { var b = e.target.closest("[data-p]"); if (b && st) openSheet(+b.dataset.p); });

  // ---- Charts kept in this browser, by name (§7) ----
  var savedKey = "gscouter.charts:" + KEYS.join(",");
  function savedList() { try { return JSON.parse(localStorage.getItem(savedKey)) || []; } catch (e) { return []; } }
  function fillSaved(pick) {
    var sel = $("ed-saved"), list = savedList();
    while (sel.options.length > 1) sel.remove(1);
    list.forEach(function (c, i) { var o = document.createElement("option"); o.value = String(i); o.textContent = c.n; sel.appendChild(o); });
    sel.value = pick !== undefined ? String(pick) : "";
    $("ed-unsave").hidden = sel.value === "";
  }
  $("ed-saved").onchange = function () {
    var c = savedList()[+this.value];
    $("ed-unsave").hidden = !c;
    if (!c) return;
    $("ed-name").value = c.n;
    if (st) snapshot();
    var keep = undoStack;
    load(c.t);
    undoStack = keep;
  };
  $("ed-save").onclick = function () {
    var name = $("ed-name").value.trim();
    if (!name) { $("ed-name").focus(); return toast(S.nameFirst); }
    var list = savedList().filter(function (c) { return c.n !== name; });
    list.unshift({n: name, t: write(st), d: new Date().toISOString().slice(0, 10)});
    list = list.slice(0, 20);
    try { localStorage.setItem(savedKey, JSON.stringify(list)); } catch (e) {}
    fillSaved(0);
    toast(S.savedMsg.replace("%s", name));
  };
  $("ed-unsave").onclick = function () {
    var i = +$("ed-saved").value, list = savedList();
    list.splice(i, 1);
    try { localStorage.setItem(savedKey, JSON.stringify(list)); } catch (e) {}
    fillSaved();
  };
  fillSaved();

  // ---- Start: the chart from the link, else the one kept in this
  // browser, else the library rotation recorded with the player's build.
  function load(text) {
    st = parse(text); undoStack = []; cursor = st.notes.length; sel = null; rangeEnd = null;
    active = st.notes.length ? st.notes[st.notes.length - 1].s : 0;
    changed();
  }
  function start(text) {
    if (text) return load(text);
    if (!ROTATION) {
      // A team the library doesn't have: a library team's rotation
      // without the member this team lacks, else an empty chart.
      if (!TEMPLATE) { notice = S.blank; load(""); return message(S.blank, false); }
      message(S.recording, false);
      return call("record", [TEMPLATE_BUILD, TEMPLATE.rotation, TEMPLATE_NAMES, MOVES]).then(function (t) {
        notice = S.template.replace("%s", TEMPLATE.name); load(t);
      }, function () { notice = S.blank; load(""); message(S.blank, false); });
    }
    message(S.recording, false);
    call("record", [BUILD, ROTATION, NAMES]).then(load, function (err) {
      message(S.recordFailed.replace("%s", err.message), true);
      load("");
    });
  }
  if (!window.WebAssembly || !window.Worker) { message(S.broken.replace("%s", "WebAssembly"), true); return; }
  boot();
  var kept = null;
  try { kept = localStorage.getItem(store); } catch (e) {}
  ready.then(function () { start(START || kept || ""); }, function (err) { message(S.broken.replace("%s", err.message), true); });
})();
</script>
{{template "foot"}}

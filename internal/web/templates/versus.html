{{template "head" "Gscouter 대결"}}
{{if .Scored}}
<div class="card verdict">
{{if .Tie}}무승부 <span class="muted">(차이 {{percent .Diff}}, 2% 미만)</span>
{{else if gt .Diff 0.0}}<span class="win">왼쪽 파티 승리</span> <span class="muted">+{{percent .Diff}}</span>
{{else}}<span class="win">오른쪽 파티 승리</span> <span class="muted">{{percent .Diff}}</span>{{end}}
</div>
{{end}}
<div class="versus">
<div class="card">{{template "team" .A}}</div>
<div class="card">{{template "team" .B}}</div>
</div>
{{template "foot"}}

notes: 'Written from the community guides (design §5.4): the KQM Iansan quick guide gives Furina ED Q > Bennett EQ N1 > Iansan ECQ > Chasca E 4[C] (C/Q) > (Bennett E); the Chasca quick guide the same order. Chasca''s combo is in the gcsim form of the community config behind Chasca / Furina / Mavuika / Bennett (db.kqm.gg): skill, four aimed shots, then her burst or a last shot; Bennett''s last skill is kept for his energy. Build: Chasca, Bennett and Furina from that config (C0, C6 Bennett); Iansan 4pc Scroll. Iansan C0 with Favonius Lance R3, KQM-standard substats and about 225% ER (the guide asks 180-210% with Favonius as the only Electro, less with a second one). Gcsim note: Iansan''s skill fills her Nightsoul points and drains them at 6 per second; her burst restores points from the active character''s movement only when the rotation reports a distance (movement()), which no source gives, so none is reported. Her burst buff therefore falls to its low-point rate a few seconds after her skill, and the score likely understates her, by at most about 6% (design §5.4).'

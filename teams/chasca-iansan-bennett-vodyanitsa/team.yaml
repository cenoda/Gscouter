notes: 'Written from guides (design §5.4; no community gcsim config with Vodyanitsa exists: upstream gcsim lacks her). enjoygm lists Chasca / Bennett / Iansan or Mavuika / Vodyanitsa (a niche sustain option) without a rotation, so the rotation is the written Chasca / Iansan / Bennett / Furina team''s (KQM Iansan quick guide order) with Vodyanitsa''s skill in Furina''s place, moved to the last swap before Chasca as she holds Thrilling Tales; she bursts when ready. Bennett''s opening skill is cast only when ready: without Furina''s actions his closing skill (the guide''s ''(Bennett E)'') leaves it on cooldown, 9.5 s/min of waits otherwise. Movement reported at 9 m/s as in that team (Iansan''s buff; see its notes). Chasca, Iansan and Bennett builds are that team''s. Vodyanitsa: C0, Thrilling Tales R5 (no teammate holds it), 4pc Tenacity (Furina held it), HP%/HP%/HP%, KQM-standard substats, 111% ER. Looped, the score keeps 92% of the one pass: without Furina''s particles Bennett and Iansan burst about every other rotation (13 and 15 of 26). The source team with Furina scores 57.8k looped (100 iterations); Vodyanitsa in her slot is 9% lower.'

notes: 'Written from guides (design §5.4; no community gcsim config with Vodyanitsa exists: upstream gcsim lacks her). enjoygm lists Chasca / Bennett / Iansan or Mavuika / Vodyanitsa (a niche sustain option) without a rotation, so the rotation is the harvested Chasca / Furina / Mavuika / Bennett team''s with Vodyanitsa''s skill in Furina''s place, moved to the last swap before Chasca as she holds Thrilling Tales; she bursts when ready. Bennett bursts when ready: Furina''s particles fed him in the source, and his unconditional burst made the one pass wait for energy (37.6k one pass); he bursts about every other rotation. Chasca, Mavuika and Bennett builds are that team''s. Vodyanitsa: C0, Thrilling Tales R5 (no teammate holds it), 4pc Tenacity (Furina held it), HP%/HP%/HP%, KQM-standard substats, 111% ER. The source team with Furina scores 79.4k looped (20 iterations); Vodyanitsa in her slot is 15% lower.'

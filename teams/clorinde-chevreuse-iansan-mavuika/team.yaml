notes: 'Written from the community guides (design §5.4): the KQM Iansan quick guide gives the opener Mavuika tE > Iansan ECQ > Chevreuse hE Q > Mavuika Q 2[CD] > Clorinde E [combo] Q and the ongoing rotation Chevreuse hEN1 > (Clorinde N1C/N3) > Iansan ECQ > Mavuika tEQ C2D CD > Clorinde E [combo] Q; the optional Clorinde normals, which only funnel particles, are left out. Clorinde''s combo is in the gcsim form of the community config behind Clorinde / Mavuika / Ororon / Chevreuse (db.kqm.gg). Build: Clorinde, Chevreuse and Mavuika from that config (C0 Clorinde and Mavuika, C6 Chevreuse); Iansan 4pc Scroll. Waits: the looped rotation sometimes skips Clorinde''s burst for energy. Iansan C0 with Favonius Lance R3, KQM-standard substats and about 225% ER (the guide asks 180-210% with Favonius as the only Electro, less with a second one). Gcsim note: Iansan''s skill fills her Nightsoul points and drains them at 6 per second; her burst restores points from the active character''s movement only when the rotation reports a distance (movement()), which no source gives, so none is reported. Her burst buff therefore falls to its low-point rate a few seconds after her skill, and the score likely understates her, by at most about 6% (design §5.4).'

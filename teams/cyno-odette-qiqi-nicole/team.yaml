notes: 'Written from GameWith''s Best Teams For Cyno, Stellar-Conduct team (design §5.4; updated 2026-10-28): Odette E (Q) > Qiqi E Q > Nicole E Q > Cyno E Q, then normal attacks with his skill whenever Judication is ready. Odette casts her skill twice, as in the KQM Odette quick guide''s rotations (2[E], placing her Dance Double; with one skill she deals 3% of the damage and the looped score is 59.6k against 67.8k), and skips her optional burst, as that guide advises. Cyno stays on field while Pactsworn Pathclearer lasts. Needs Cyno''s Witch''s Revelation (upstream PR #3250, on the fork; gcsim''s default revelation=1): inside a Polestar Field his Duststalker Bolts become Starsame bolts, 200% ATK plus 600% EM as Stellar-Conduct DMG, and his skill outside the burst grants 6 s of Pactsworn Pathclearer. Cyno: C0, Staff of the Scarlet Sands R1, 4pc Disenchantment in Deep Shadow, EM/EM/CRIT Rate, KQM-standard substats (the GameWith, GenshinBuilds and AllThingsHow guides'' best). Odette and Qiqi (C6) as in the Sandrone teams, Nicole as in the Vesna teams (GameWith suggests Angelos'' Heptades and Noblesse Oblige).'

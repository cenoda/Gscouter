notes: 'Written from the community guides (design §5.4): the KQM Iansan quick guide gives Aino EQ > Iansan ECQ > Sucrose ED > Flins E N1 E sQ D N3D N4D 2[D] E sQ N4D N5; the Flins quick guide the same. sQ is Flins''s short burst in his skill state. The guide''s two extra dashes, which refresh Iansan''s Nightsoul points in game, are left out: the reported movement already keeps her points up, and in gcsim they only waited on the dash cooldown (3.7 s/min). Build: Flins, Aino and Sucrose from the community config behind Flins / Ineffa / Aino / Sucrose (db.kqm.gg; C0 Flins, C6 Aino and Sucrose); Iansan 4pc Noblesse, as the guide recommends in Flins teams. Waits: the looped rotation sometimes skips Flins''s burst for energy. Iansan C0 with Favonius Lance R3, KQM-standard substats and about 225% ER (the guide asks 180-210% with Favonius as the only Electro, less with a second one). Movement: Iansan''s burst restores Nightsoul points from the active character''s movement, which gcsim counts only when the rotation reports it. The Iansan guide says Flins "can sustain them thanks to his flexible combo and special Elemental Burst movement", so every action reports movement at 9 m/s since the previous one, the lowest speed tried (6, 9, 12) above which the score stops rising: her higher ATK buff stays up. The speed stands for the guide''s statement, not a measurement.'

notes: 'Written from the community guides (design §5.4): the KQM Iansan quick guide gives Bennett E > Iansan ECQ > Bennett Q E > Citlali EQ > Gaming Q 5-6[EP]; the Gaming quick guide the same. Gaming''s six EPs and Bennett''s attacks until Favonius Sword procs are as in the community config behind Gaming / Citlali / Xianyun / Bennett (db.kqm.gg). Build: Gaming, Bennett and Citlali from that config (C6 Gaming and Bennett, C0 Citlali); Iansan 2pc Scroll + 2pc Gladiator, as the guide advises when teammates hold 4pc Scroll and Noblesse. Waits: Gaming 0.7 s/min and Iansan 0.8 s/min for energy. Iansan C0 with Favonius Lance R3, KQM-standard substats and about 225% ER (the guide asks 180-210% with Favonius as the only Electro, less with a second one). Movement: Iansan''s burst restores Nightsoul points from the active character''s movement, which gcsim counts only when the rotation reports it. The Iansan guide says Gaming "easily keeps Iansan''s Nightsoul points above 42 for the higher Flat ATK buff", so every action reports movement at 9 m/s since the previous one, the lowest speed tried (6, 9, 12) above which the score stops rising: her higher ATK buff stays up. The speed stands for the guide''s statement, not a measurement.'

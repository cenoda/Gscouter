notes: 'Written from the community guides (design §5.4): the KQM Iansan quick guide gives Bennett E > Iansan ECQ > Bennett Q E > Citlali EQ > Gaming Q 5-6[EP]; the Gaming quick guide the same. Gaming''s six EPs and Bennett''s attacks until Favonius Sword procs are as in the community config behind Gaming / Citlali / Xianyun / Bennett (db.kqm.gg). Build: Gaming, Bennett and Citlali from that config (C6 Gaming and Bennett, C0 Citlali); Iansan 2pc Scroll + 2pc Gladiator, as the guide advises when teammates hold 4pc Scroll and Noblesse. Waits: Gaming 0.7 s/min and Iansan 0.8 s/min for energy. Iansan C0 with Favonius Lance R3, KQM-standard substats and about 225% ER (the guide asks 180-210% with Favonius as the only Electro, less with a second one). Gcsim note: Iansan''s skill fills her Nightsoul points and drains them at 6 per second; her burst restores points from the active character''s movement only when the rotation reports a distance (movement()), which no source gives, so none is reported. Her burst buff therefore falls to its low-point rate a few seconds after her skill, and the score likely understates her, by at most about 6% (design §5.4).'

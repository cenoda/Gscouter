notes: 'Written from guides (design §5.4; no community gcsim config with Vodyanitsa exists: upstream gcsim lacks her). LDShop, wishgm and AllThingsHow name Ganyu as a substitute for Skirk in Skirk / Furina / Escoffier / Vodyanitsa; no guide has a Ganyu team of its own with her. The rotation and every other build are the harvested Ganyu / Furina / Escoffier / Citlali team''s, with Vodyanitsa''s skill in place of Citlali''s, moved after Escoffier''s so that she is the last swap before Ganyu; Vodyanitsa casts her skill, the last swap before the carry where she holds Thrilling Tales (Gaming ProMax: Vodyanitsa should be the last swap before Skirk with it), and bursts when ready (the guide: the burst is lowest priority; with 111% ER about every other rotation or less). Her healing keeps Furina''s Fanfare up where Furina is in the team.'

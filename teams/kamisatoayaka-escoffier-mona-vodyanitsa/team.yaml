notes: 'Written from guides (design §5.4; no community gcsim config with Vodyanitsa exists: upstream gcsim lacks her). enjoygm''s A-tier Freeze option: Ayaka or Lohen / Escoffier / Furina or Mona / Vodyanitsa. The Vodyanitsa guide''s Lohen team gives the order Vodyanitsa E > Escoffier E > Mona. The rotation and every other build are the harvested Kamisato Ayaka / Furina / Mona / Escoffier team''s, with Vodyanitsa''s skill in place of Furina''s, first as in that order; Vodyanitsa casts her skill, the last swap before the carry where she holds Thrilling Tales (Gaming ProMax: Vodyanitsa should be the last swap before Skirk with it), and bursts when ready (the guide: the burst is lowest priority; with 111% ER about every other rotation or less). Her healing keeps Furina''s Fanfare up where Furina is in the team.'

notes: 'Written from the KQM Vodyanitsa quick guide (design §5.4; no community gcsim config with Vodyanitsa exists: upstream gcsim lacks her). Its Ayato team, Vodyanitsa / Ayato / Citlali / Escoffier, with its rotation as written: Ayato Q > Escoffier E > Vodyanitsa E Q > Citlali EQ > Ayato E N15 > Escoffier Q E > Vodyanitsa E Q > Citlali E > Ayato E N15. Ayato, Citlali and Escoffier are the harvested Kamisato Ayato / Citlali / Furina / Escoffier team''s. Vodyanitsa: C0, Prototype Amber R5 (the guide: she bursts every rotation beside Hydro damage dealers, with Amber), 4pc Tenacity, HP%/HP%/HP%, KQM-standard substats, 155.1% ER (10 ER rolls in place of CRIT rolls), the least at which she bursts twice per rotation as the rotation says (the guide''s double Hydro range with Amber is 145-155%; at 144.1% she waits 7 s/min for energy, and at 111% the looped score skips her bursts for 67.7k, -2.4%). Against the harvested Kamisato Ayato / Citlali / Furina / Escoffier team (70.0k looped, 20 iterations) Vodyanitsa in Furina''s slot gives about the same score.'

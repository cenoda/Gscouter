notes: 'Written from the community guides (design §5.4): the KQM Iansan quick guide gives (Kinich Q) > Mavuika Q tE > Bennett Q E > Iansan ECQ > Kinich shE [combo], with the note that Iansan''s enhanced charged attack must not be left out; the Kinich quick guide gives the same order. Kinich''s combo is the guide''s shE 5[N2 shE], in the gcsim form of the community config behind Kinich / Mavuika / Bennett / Ororon (db.kqm.gg). Build: Kinich, Mavuika and Bennett from that config (C0, C6 Bennett); Iansan 4pc Scroll. Waits: the looped rotation sometimes skips Iansan''s burst for energy, Bennett waits 0.7 s/min. Iansan C0 with Favonius Lance R3, KQM-standard substats and about 225% ER (the guide asks 180-210% with Favonius as the only Electro, less with a second one). Gcsim note: Iansan''s skill fills her Nightsoul points and drains them at 6 per second; her burst restores points from the active character''s movement only when the rotation reports a distance (movement()), which no source gives, so none is reported. Her burst buff therefore falls to its low-point rate a few seconds after her skill, and the score likely understates her.'

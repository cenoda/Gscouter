notes: 'Written from the community guides (design §5.4): the KQM Iansan quick guide gives Emilie Q/E > Iansan ECQ > Mavuika tE Q > Kinich shE (Q) [combo], with Mavuika''s tE before Iansan in the first rotation; the Kinich quick guide gives the same order. Emilie bursts when ready, else uses her skill. Kinich''s combo as in Kinich / Mavuika / Iansan / Bennett, from the community config behind Kinich / Mavuika / Bennett / Ororon. Build: Kinich, Mavuika and Emilie from the harvested Kinich / Mavuika / Bennett / Emilie (all C0); Iansan 4pc Scroll. The looped score keeps 130% of the one pass: the first rotation starts with Emilie''s skill and no Burning, later ones with her burst. Iansan C0 with Favonius Lance R3, KQM-standard substats and about 225% ER (the guide asks 180-210% with Favonius as the only Electro, less with a second one). Gcsim note: Iansan''s skill fills her Nightsoul points and drains them at 6 per second; her burst restores points from the active character''s movement only when the rotation reports a distance (movement()), so the buff falls to its low-point rate a few seconds after her skill unless movement is reported. Movement: for Iansan''s higher ATK buff, a reviewer who plays the characters says Mavuika keeps it nearly always at its maximum; the Kinich quick guide says Kinich easily keeps Iansan''s Nightsoul points high, so the time after each of Mavuika and Kinich''s actions reports movement at 9 m/s, the speed at which the buff stays up in the Iansan teams that report movement. The speed stands for that statement, not a measurement (design §5.4).'

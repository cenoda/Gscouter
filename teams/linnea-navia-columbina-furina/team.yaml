notes: 'Written from the community guides (design §5.4): the Linnea quick guide lists Linnea / Navia / Columbina / Furina as its second team and gives its rotation: (Linnea E, first rotation) > Furina ED Q > Linnea Q > Columbina E Q > Navia Q tE 2[N2D] N2 > Furina N2 > Navia tE 2[N2D] N2 (tE). Linnea''s burst is replaced by her skill (tapped, Super Power Form) whenever it is ready, 18 of 22 rotations in the check: on the fork a burst while Lumi is out stops Lumi''s attacks and the A1 shred for the rest of its duration (design §5.4), and the guide''s burst only refreshes Lumi. Navia''s third skill is used when ready; crystallize shards are picked up on each dash. Build at a 4-star baseline (C0, 4-star weapons, KQM-standard artifacts): Linnea as in the other Linnea teams (Slingshot R5, 4pc Husk); Navia Serpent Spine R1 (5 stacks), 4pc Nighttime Whispers, ATK/Geo/CRIT; Columbina Prototype Amber R5, 4pc SMS, as in Nefer / Linnea / Lauma / Columbina; Furina Festering Desire R5, 4pc Golden Troupe. Waits: none above 2 s/min; no energy waits. The rotation is about 20.5 s. Fork notes: Linnea''s A4 EM buff is not refreshed on swap.'

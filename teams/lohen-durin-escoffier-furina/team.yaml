notes: 'Written from the KQM Lohen quick guide (design §5.4; no community gcsim config with Lohen exists). The guide''s example team 4: Furina ED N1 Q > Escoffier EQ > Durin E N1 Q > Lohen [combo]. Lohen plays the guide''s average combo, E 2[N1C] E/Q 4[N1C] E 5[N1C] E: the first E opens Masterstroke, each later E is Etched Into Bone and Soul (100 Joy, two N1C strings); all three Etched land in every rotation, and his burst is cast when ready (the guide: it does not justify building ER, so he has none). Lohen''s build is the same in every Lohen team: C0, Disaster and Remorse R1, 4pc Rising Winds (the guide''s best in slot), ATK%/Cryo/CRIT DMG, KQM-standard substats. Durin as in Lohen / Durin / Nicole / Citlali (ER sands, 163%); Escoffier and Furina from the harvested Ganyu / Furina / Escoffier / Mona team, both raised to 186% ER, the least at which both burst every rotation (at 175% Escoffier skips about one burst in ten). No waits. Furina''s Hydro turns part of Lohen''s Cryo into freeze rather than melt, so Durin deals about half of what he does in the Citlali team.'

notes: 'Written from the KQM Lohen quick guide (design §5.4; no community gcsim config with Lohen exists). The guide''s example team 1 with Citlali, which it calls typically best overall: Nicole EQ > Citlali EQ > Durin E N1 Q > Lohen [combo]. Lohen plays the guide''s average combo, E 2[N1C] E/Q 4[N1C] E 5[N1C] E: the first E opens Masterstroke, each later E is Etched Into Bone and Soul (100 Joy, two N1C strings); all three Etched land in every rotation, and his burst is cast when ready (the guide: it does not justify building ER, so he has none). Lohen''s build is the same in every Lohen team: C0, Disaster and Remorse R1, 4pc Rising Winds (the guide''s best in slot), ATK%/Cryo/CRIT DMG, KQM-standard substats. Supports from the harvested Chongyun / Durin / Citlali / Nicole team, with ER raised until every burst fires every rotation: Durin with an ER sands (179%, the guide''s 170-185% for the Pyro unit with Citlali), Nicole 144% (the guide gives 125-140%; at 139% she skips a burst now and then), Citlali 179%. No waits.'

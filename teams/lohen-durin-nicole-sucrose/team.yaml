notes: 'Written from the KQM Lohen quick guide (design §5.4; no community gcsim config with Lohen exists). The guide''s example team 1 with Sucrose (three Hexerei members besides Lohen''s own): Nicole EQ > Durin E N1 Q > Sucrose ED N1 > Lohen [combo]. Lohen plays the guide''s average combo, E 2[N1C] E/Q 4[N1C] E 5[N1C] E: the first E opens Masterstroke, each later E is Etched Into Bone and Soul (100 Joy, two N1C strings); all three Etched land in every rotation, and his burst is cast when ready (the guide: it does not justify building ER, so he has none). Lohen''s build is the same in every Lohen team: C0, Disaster and Remorse R1, 4pc Rising Winds (the guide''s best in slot), ATK%/Cryo/CRIT DMG, KQM-standard substats. Nicole and Sucrose from the harvested Wriothesley / Sucrose / Durin / Nicole team, Durin as in Lohen / Durin / Nicole / Citlali (ER sands, 163%); Nicole''s ER raised to 150% (the guide''s 145-175% with Lohen the only Cryo unit) so that she bursts every rotation. No waits. Sucrose''s C6 Hexerei bonus applies; her burst is not in the guide''s rotation.'

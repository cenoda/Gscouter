notes: 'Written from the KQM Lohen quick guide (design §5.4; no community gcsim config with Lohen exists). The guide''s example team 8 (Freeze) with Furina: Furina ED N1 Q > Escoffier EQ > Mona EQ N1 > Lohen [combo]. Lohen plays the guide''s combo for Freeze teams: E 15-17[N1C] (N1 E), here 15 strings (the guide''s average is 15-16) then N1 and one Etched Into Bone and Soul; his burst is cast when ready (no ER, as the guide says). Lohen''s build is the same in every Lohen team: C0, Disaster and Remorse R1, 4pc Rising Winds (the guide''s best in slot), ATK%/Cryo/CRIT DMG, KQM-standard substats. Supports from the harvested Ganyu / Furina / Escoffier / Mona team; Escoffier and Furina raised to 175% ER, the least at which every member bursts every rotation. No waits. The guide recommends Marechaussee Hunter on Lohen in Freeze with Furina; the build keeps Rising Winds, as in every Lohen team.'

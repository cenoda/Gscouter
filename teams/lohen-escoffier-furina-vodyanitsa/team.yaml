notes: 'Written from guides (design §5.4; no community gcsim config with Vodyanitsa or Lohen exists: upstream gcsim lacks both). enjoygm lists Lohen / Furina / Prune or Escoffier / Vodyanitsa, and Ayaka or Lohen / Escoffier / Furina or Mona / Vodyanitsa. The rotation is the KQM Lohen quick guide''s Freeze team, Furina ED N1 Q > Escoffier EQ > Mona EQ N1 > Lohen combo, with Vodyanitsa''s skill in Mona''s place, as in Lohen / Escoffier / Furina / Mona, whose builds this team copies. Vodyanitsa casts her skill, the last swap before the carry where she holds Thrilling Tales (Gaming ProMax: Vodyanitsa should be the last swap before Skirk with it), and bursts when ready (the guide: the burst is lowest priority; with 111% ER about every other rotation or less). Her healing keeps Furina''s Fanfare up where Furina is in the team. The Prune variant is not added: no harvested team or guide gives a Prune build.'

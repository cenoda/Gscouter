notes: 'Written from the KQM Lohen quick guide (design §5.4; no community gcsim config with Lohen exists). The guide''s example team 2 with Citlali: Nicole EQ > Citlali EQ > Mavuika QE > Lohen [combo]. Mavuika''s E after her burst leaves Flamestrider when she swaps out, so her Ring of Searing Radiance stays off-field, as community Mavuika configs write it (burst, skill). Lohen plays the guide''s average combo, E 2[N1C] E/Q 4[N1C] E 5[N1C] E: the first E opens Masterstroke, each later E is Etched Into Bone and Soul (100 Joy, two N1C strings); all three Etched land in every rotation, and his burst is cast when ready (the guide: it does not justify building ER, so he has none). Lohen''s build is the same in every Lohen team: C0, Disaster and Remorse R1, 4pc Rising Winds (the guide''s best in slot), ATK%/Cryo/CRIT DMG, KQM-standard substats. Supports from the harvested Mavuika / Citlali / Sucrose / Nicole team; Nicole''s ER raised to 128% (guide 125-140%) so that she bursts every rotation. Mavuika bursts every rotation on Fighting Spirit from the team''s attacks. No waits.'

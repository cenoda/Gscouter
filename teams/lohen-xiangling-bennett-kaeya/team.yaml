notes: 'Written from the KQM Lohen quick guide (design §5.4; no community gcsim config with Lohen exists). The guide''s example team 5 (limited roster) with Kaeya, all 4-star teammates: Bennett QE > Xiangling QED > Kaeya EQ > Lohen [combo] > Bennett E > Xiangling N3 > Kaeya E. Lohen plays the guide''s combo for teams without a Hexerei teammate: E 15-17[N1C] (N1 E), here 15 strings (the guide''s average is 15-16) then N1 and one Etched Into Bone and Soul; his burst is cast when ready (no ER, as the guide says). Lohen''s build is the same in every Lohen team: C0, Disaster and Remorse R1, 4pc Rising Winds (the guide''s best in slot), ATK%/Cryo/CRIT DMG, KQM-standard substats. Without a second Hexerei member Lohen gets neither his +40% nor Disaster and Remorse''s Hexerei boost, and Will to Win stays low (no teammate hits for 1000% of his base ATK), so his Etched hits are about a fifth of those in the Durin teams. Supports from the harvested Rosaria / Bennett / Xiangling / Kaeya team; Xiangling with Favonius Lance R3 instead of The Catch (the guide assumes Favonius for her) and 248% ER, Bennett 196%: the least at which both burst every rotation in this 24 s rotation (with The Catch at 220% Xiangling burst every other rotation). Kaeya''s skill cooldown before his first E is filled with attacks.'

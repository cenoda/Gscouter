notes: 'Written from the community guides (design §5.4): the KQM Iansan quick guide gives Mavuika tE > Bennett EQ > Iansan ECQ > Citlali EQ N1 > Mavuika [combo], the Mavuika quick guide the same order. Iansan''s ECQ is skill, Swift Stormflight (her enhanced charged attack), burst. Mavuika''s burst combo is the dash-cancelled one of the community config behind Mavuika / Citlali / Xilonen / Bennett (db.kqm.gg/db/cdz8FgbKf7wk); the Albedo team''s simpler combo scored 66.0k one pass. Build: Mavuika, Citlali and Bennett from that config (all C0 but C6 Bennett); Iansan 2pc Scroll + 2pc Gladiator, as the guide advises when teammates hold 4pc Scroll and Noblesse. Iansan C0 with Favonius Lance R3, KQM-standard substats and about 225% ER (the guide asks 180-210% with Favonius as the only Electro, less with a second one). Gcsim note: Iansan''s skill fills her Nightsoul points and drains them at 6 per second; her burst restores points from the active character''s movement only when the rotation reports a distance (movement()), so the buff falls to its low-point rate a few seconds after her skill unless movement is reported. Movement: for Iansan''s higher ATK buff, a reviewer who plays the characters says Mavuika keeps it nearly always at its maximum, so the time after each of Mavuika''s actions reports movement at 9 m/s, the speed at which the buff stays up in the Iansan teams that report movement. The speed stands for that statement, not a measurement (design §5.4).'

notes: 'Written from the KQM Nefer quick guide (design §5.4): the guide''s second example team, Nefer / Aino / Lauma / Nahida or Sucrose (high ceiling, fragile without sustain). Rotation: Lauma Q hE > Aino EQ > Nahida E (Q) > Nefer E 3[CD] E CD CQ CD (the guide''s dash-cancel combo). Lauma holds her skill when there is Verdant Dew, otherwise taps it, checked after her burst; Nefer''s charged attacks are held (Slither) until Dew turns them into Phantasm Performance. Build: Nefer, Lauma as in Nefer / Lauma / Columbina / Sucrose (C0 Nefer with Dawning Frost R5 and artifacts well above KQM standard, Lauma 4pc Deepwood with 218% ER); supports with 4-star weapons and artifacts at the level of that team''s supports: C6 Aino Favonius Greatsword R3, 4pc SMS, ER/EM/CRIT; C0 Nahida Prototype Amber R5 (the guide''s sustain option), 4pc Gilded Dreams, EM/EM/EM. Waits: Nefer''s two skill charges need 18 s and the rotation is shorter, so the looped score fills her skill cooldown with attacks (as in Nefer / Lauma / Columbina / Sucrose). Aino''s Hydro starts with her burst and the team has no Moonridge Dew (Columbina), so the single rotation from a standing start gets about one Phantasm Performance; the looped score enters each rotation with Dew from the last one, so it keeps more than the one pass. No energy waits. Fork notes as in Nefer / Lauma / Columbina / Sucrose: Phantasm hits after the first are not cancelled by the dash, so Nefer''s second hit, which the guide says a dash cancel loses, still lands (about 1.5% of the damage); Phantasm and charged hits apply 25U Dendro without ICD.'

notes: 'Written from the KQM Nefer quick guide (design §5.4): the guide''s Lauma-less example team, Nefer / Aino / Nahida / Kuki Shinobu (a substantial downgrade, the guide says). Moonsign comes from Nefer and Aino. With Shinobu the guide starts the first rotation with Nefer''s skill. Rotation: (Nefer E, first rotation) > Nahida E (Q) > Aino EQ > Shinobu E > Nefer E 3[CD] E CD CQ CD (the guide''s dash-cancel combo). Nefer''s charged attacks are held (Slither) until Dew turns them into Phantasm Performance. Build: Nefer as in Nefer / Lauma / Columbina / Sucrose (C0, Dawning Frost R5, artifacts well above KQM standard); supports with 4-star weapons and artifacts at the level of that team''s supports: C6 Aino Favonius Greatsword R3, 4pc SMS, ER/EM/CRIT; C0 Nahida Prototype Amber R5, 4pc Deepwood (no Lauma), EM/EM/EM; C6 Kuki Shinobu Sapwood Blade R5, 4pc Instructor, HP/EM/EM. Waits: Nefer''s two skill charges need 18 s and the rotation is shorter, so the looped score fills her skill cooldown with attacks (as in Nefer / Lauma / Columbina / Sucrose). Aino''s Hydro starts with her burst and the team has no Moonridge Dew (Columbina), so the single rotation from a standing start gets about one Phantasm Performance; the looped score enters each rotation with Dew from the last one, so it keeps more than the one pass. No energy waits. Fork notes as in Nefer / Lauma / Columbina / Sucrose: Phantasm hits after the first are not cancelled by the dash, so Nefer''s second hit, which the guide says a dash cancel loses, still lands (about 1.5% of the damage); Phantasm and charged hits apply 25U Dendro without ICD.'

notes: 'Written from the KQM Nefer quick guide (design §5.4): the guide''s fourth example team with Shinobu for Ineffa. Furina skips her burst, as the guide says. With Shinobu the guide starts the first rotation with Nefer''s skill. Rotation: (Nefer E, first rotation) > Lauma Q hE > Furina E > Shinobu E > Nefer E 3[CD] E CD CQ CD (the guide''s dash-cancel combo). The guide says Furina''s 20 s skill cooldown forces a longer rotation: the looped rotation waits about 17 s/min for it. Lauma holds her skill when there is Verdant Dew, otherwise taps it, checked after her burst; Nefer''s charged attacks are held (Slither) until Dew turns them into Phantasm Performance. Build: Nefer, Lauma as in Nefer / Lauma / Columbina / Sucrose (C0 Nefer with Dawning Frost R5 and artifacts well above KQM standard, Lauma 4pc Deepwood with 218% ER); supports with 4-star weapons and artifacts at the level of that team''s supports: C0 Furina Favonius Sword R3, 4pc Golden Troupe, HP/HP/CRIT; C6 Kuki Shinobu Sapwood Blade R5, 4pc Instructor, HP/EM/EM. No energy waits. Fork notes as in Nefer / Lauma / Columbina / Sucrose: Phantasm hits after the first are not cancelled by the dash, so Nefer''s second hit, which the guide says a dash cancel loses, still lands (about 1.5% of the damage); Phantasm and charged hits apply 25U Dendro without ICD.'

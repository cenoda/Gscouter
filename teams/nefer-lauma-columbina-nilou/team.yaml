notes: 'Added on request (both Columbina and Nilou). Written from the KQM Nilou quick guide (design §5.4), Nilou / Nefer / Lauma / Columbina, Nefer''s best team with Nilou there: (Lauma N1) > Columbina EQ > Lauma hEQ > Nilou E N2 E > Nefer combo > Columbina CD, Lauma''s N1 first rotation only. Nefer combo as in the other Nefer teams: E 3[CD] E 3[CD], burst when ready. Build: Nefer, Lauma (4pc Deepwood) and Columbina (4pc SMS) as in the Sucrose team; Nilou 4pc Instructor, as the guide suggests when another member holds SMS. Lauma holds her skill when there is Dew, otherwise taps it. Waits: none above 2 s/min; no energy waits. Nilou: C0, Favonius Sword R5, HP/HP/HP with support substats; the guide says her stats matter little in Lunar-Bloom and she needs no ER, so her burst is used when ready. Nefer''s Seeds of Deceit take every Dendro Core, so Nilou makes no Bountiful Cores, as the guide says. Her A1 EM buff needs a party member to be hit by Dendro attacks; with the cores turned into Seeds that is rare here (about 1 shade hit in 8 has it). Nefer''s charged attacks are held (Slither) until Verdant Dew turns them into Phantasm Performance. Fork notes as in Nefer / Lauma / Columbina / Sucrose.'

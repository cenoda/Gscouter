notes: 'Added on request: Nefer / Lauma / Columbina / Nahida with Nilou for Columbina. Written from the KQM Nilou quick guide (design §5.4), Nilou / Nefer / Lauma / Nahida: Nahida EQ > Lauma tEQ > Nilou E N2 E > Nefer combo. Nefer combo as in the other Nefer teams; Nahida''s burst when ready. Build: Nefer, Lauma (4pc Gilded Dreams) and Nahida (Widsith R5, 4pc Deepwood) as in the Columbina team; Nilou 4pc SMS. All members are Dendro or Hydro, so Nilou''s Golden Chalice is on. Waits: Nilou 4.9 s/min for her 18 s skill (17.4 s rotation); no energy waits. Nilou: C0, Favonius Sword R5, HP/HP/HP with support substats; the guide says her stats matter little in Lunar-Bloom and she needs no ER, so her burst is used when ready. Nefer''s Seeds of Deceit take every Dendro Core, so Nilou makes no Bountiful Cores, as the guide says. Her A1 EM buff needs a party member to be hit by Dendro attacks; with the cores turned into Seeds that is rare here (about 1 shade hit in 8 has it). Nefer''s charged attacks are held (Slither) until Verdant Dew turns them into Phantasm Performance. Fork notes as in Nefer / Lauma / Columbina / Sucrose.'
cross_check:
    note: 'No public number for this team (searched 2026-10-27: the KQM Nilou quick guide gives none; web searches found team lists and community discussion only). For scale, at the same Nefer build: with Columbina instead of Nilou the team is 165.3k looped; this one 102.9k one pass, 104.9k looped. In a 120 s fight Nefer gets 32 Phantasm Performances here against 39 with Columbina, whose Moonridge Dew adds to the Verdant Dew, and Columbina deals about 12% of that team''s damage herself. Nilou''s constellations (looped, 500 iterations): C0 104.9k, C4 120.8k, C6 121.8k (C2''s RES shred under Golden Chalice).'

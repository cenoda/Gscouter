notes: 'Added on request: Nefer / Lauma / Columbina / Sucrose with Nilou for Columbina. Written from the KQM Nilou quick guide (design §5.4), Nilou / Nefer / Lauma / Sucrose: Lauma tEQ > Nilou E N2 E > Sucrose N1 E (Q) > Nefer combo. Nefer combo as in the other Nefer teams. Build: Nefer, Lauma (4pc Deepwood) and Sucrose (4pc Instructor) as in the Columbina team; Nilou 4pc SMS. Sucrose is Anemo, so Nilou''s Golden Chalice is off. Waits: Nilou 5.7 s/min for her 18 s skill (17.0 s rotation); no energy waits. Nilou: C0, Favonius Sword R5, HP/HP/HP with support substats; the guide says her stats matter little in Lunar-Bloom and she needs no ER, so her burst is used when ready. Nefer''s Seeds of Deceit take every Dendro Core, so Nilou makes no Bountiful Cores, as the guide says. Her A1 EM buff needs a party member to be hit by Dendro attacks; with the cores turned into Seeds that is rare here (about 1 shade hit in 8 has it). Nefer''s charged attacks are held (Slither) until Verdant Dew turns them into Phantasm Performance. Fork notes as in Nefer / Lauma / Columbina / Sucrose.'
cross_check:
    note: 'No public number for this team (searched 2026-10-27: the KQM Nilou quick guide gives none; web searches found team lists and community discussion only). For scale, at the same Nefer build: with Columbina instead of Nilou the team is 168.7k looped (183k in game, HoYoLAB 44026962); this one 116.9k one pass, 113.2k looped. Columbina deals about 12-15% of her teams'' damage herself and her Moonridge Dew feeds Nefer more Phantasm Performances (39 against 32 in a 120 s fight, the Nahida pair). Nilou''s constellations (looped, 500 iterations): C0 113.2k, C4 113.6k, C6 114.8k; Sucrose keeps Golden Chalice off, so C2''s shred never applies.'

notes: 'Written from the community guides (design §5.4): the Linnea quick guide lists Linnea / Nefer / Lauma / Columbina as its fourth team, the only one with Nefer, and gives its rotation: (Nefer N1) > Columbina E Q > Linnea 5[E] (Q) > Lauma (N1) hE Q > Nefer E 3[CD] E 3[CD] (Q). Linnea does not trigger Lunar-Crystallize here and plays her Ultimate Power Form nuke: one press and three recasts in gcsim (the guide''s 5[E]; a fifth press would wait for the 18 s cooldown). Lauma holds her skill when there is Dew, otherwise taps it. Builds follow the guides: Nefer as in Nefer / Lauma / Aino / Nahida; Linnea Slingshot R5 (best free option for her own damage), 4pc Husk, DEF/DEF/CRIT; Lauma Etherlight R5, 4pc Deepwood, ER/EM/EM (218% ER, double Dendro with Nefer needs 210-225%); Columbina Prototype Amber R5, 4pc SMS, ER/HP/CRIT. Waits: the rotation is 15.5 s, under Linnea''s 18 s skill cooldown, so the looped rotation waits about 11 s/min for her skill. No energy waits. Fork notes: Linnea''s burst is left out (the guide uses it only for healing), because on the fork a burst while Lumi is out stops Lumi''s attacks; Nefer''s notes as in Nefer / Lauma / Aino / Nahida.'

notes: 'Written from the community guides (design §5.4): the Linnea quick guide lists Linnea / Nefer / Lauma / Columbina as its fourth team, the only one with Nefer, and gives its rotation: (Nefer N1) > Columbina E Q > Linnea 5[E] (Q) > Lauma (N1) hE Q > Nefer E 3[CD] E 3[CD] (Q). Linnea does not trigger Lunar-Crystallize here and plays her Ultimate Power Form nuke: one press and three recasts in gcsim (the guide''s 5[E]; a fifth press would wait for the 18 s cooldown). Lauma holds her skill when there is Dew, otherwise taps it. Builds: Nefer and Lauma as in Nefer / Lauma / Columbina / Sucrose, at the level of that team''s cross-check (Nefer Dawning Frost R5, artifacts well above KQM standard; Lauma 4pc Deepwood, 218% ER, double Dendro with Nefer needs 210-225%); Linnea Slingshot R5 (best free option for her own damage), 4pc Husk, DEF/DEF/CRIT; Columbina Prototype Amber R5, 4pc SMS, ER/HP/CRIT. Waits: the rotation is 15.5 s, under Linnea''s 18 s skill cooldown, so the looped rotation waits about 11 s/min for her skill. No energy waits. Fork notes: Linnea''s burst is left out (the guide uses it only for healing), because on the fork a burst while Lumi is out stops Lumi''s attacks; Nefer''s notes as in Nefer / Lauma / Columbina / Sucrose.'
cross_check:
    note: 'No public number for this team (searched 2026-10-27: KQM quick guides, KQM TCL, the community gcsim database, Prydwen (HTTP 403)). For scale: the strongest Nefer team, Nefer / Lauma / Columbina / Sucrose, is 183k in game at the same build level (HoYoLAB 44026962) and 179.3k one pass here; this team gives up Sucrose''s EM for Linnea''s nuke and scores 150.1k one pass.'

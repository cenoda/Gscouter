notes: 'Written from the KQM Nefer quick guide (design §5.4): the guide''s third example team, Nefer / Kokomi / Lauma / Nahida. Rotation: Lauma Q hE > Kokomi E > Nahida E (Q) > Nefer E 3[CD] E CD CQ CD (the guide''s dash-cancel combo); Kokomi''s burst is not used (healing only). Her 20 s skill cooldown is longer than the 14.2 s rotation; Sacrificial Fragments resets it often, and the looped rotation fills the rest with her attacks. Lauma holds her skill when there is Verdant Dew, otherwise taps it, checked after her burst; Nefer''s charged attacks are held (Slither) until Dew turns them into Phantasm Performance. Build: Nefer, Lauma as in Nefer / Lauma / Columbina / Sucrose (C0 Nefer with Dawning Frost R5 and artifacts well above KQM standard, Lauma 4pc Deepwood with 218% ER); supports with 4-star weapons and artifacts at the level of that team''s supports: C0 Kokomi Sacrificial Fragments R5 (the guide''s choice for her skill cooldown), 4pc SMS, HP/HP/Healing; C0 Nahida Prototype Amber R5 (the guide''s sustain option), 4pc Gilded Dreams, EM/EM/EM. Waits: Nefer''s two skill charges need 18 s and the rotation is shorter, so the looped score fills her skill cooldown with attacks (as in Nefer / Lauma / Columbina / Sucrose). The single rotation from a standing start gets few Phantasm Performances (no Dew yet, no Moonridge Dew), so the looped score keeps more than the one pass. No energy waits. Fork notes as in Nefer / Lauma / Columbina / Sucrose: Phantasm hits after the first are not cancelled by the dash, so Nefer''s second hit, which the guide says a dash cancel loses, still lands (about 1.5% of the damage); Phantasm and charged hits apply 25U Dendro without ICD.'

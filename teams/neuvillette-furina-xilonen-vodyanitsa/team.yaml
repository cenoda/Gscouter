notes: 'Written from the KQM Vodyanitsa quick guide (design §5.4; no community gcsim config with Vodyanitsa exists: upstream gcsim lacks her). Its Neuvillette team with Xilonen for Escoffier, Vodyanitsa / Neuvillette / Furina / Xilonen; GenshinBuilds rates Neuvillette / Furina / Vodyanitsa / Xilonen S. The rotation is the guide''s, as written: the Escoffier version''s (Neuvillette E > Furina ED N3 > Escoffier EQ > Vodyanitsa EQ > Furina Q > Neuvillette C E C Q > Escoffier E N1 > Vodyanitsa EQ > Neuvillette 2[C]) with Xilonen EQ N2 and Xilonen E N2 in place of Escoffier''s actions, as the guide says. Neuvillette''s C is his charged attack (Equitable Judgment, held to its end, as gcsim''s charge and the harvested Neuvillette rotations write it); 2[C] is two of them. Neuvillette, Furina and Xilonen are the harvested Neuvillette / Furina / Xilonen / Escoffier team''s. Vodyanitsa: C0, Prototype Amber R5 (the guide: she bursts every rotation beside Hydro damage dealers, with Amber), 2pc Tenacity of the Millelith + 2pc Vourukasha''s Glow (the guide''s choice when the main DPS does not scale with ATK, such as Neuvillette), HP%/HP%/HP%, KQM-standard substats, 133.1% ER (6 ER rolls in place of 4 CRIT rolls), the least at which she bursts twice per rotation as the rotation says (the guide''s triple Hydro range with Amber is 100-130%; at 122% she waits 0.7 s/min for energy, and at 111% the looped score skips her bursts). Her second skill comes about 12 s after the first against a 16 s cooldown, so she waits 4.6 s/min for it (the guide''s rotation as written). Against the harvested teams with Escoffier (89.3k looped) and Ineffa (94.3k) in her slot, she scores 22% and 16% more; AllThingsHow puts her only 1-5k above Ineffa teams for Neuvillette.'

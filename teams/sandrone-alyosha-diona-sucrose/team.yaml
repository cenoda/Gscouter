notes: 'Written from the KQM Sandrone quick guide (design §5.4; no community gcsim config with Sandrone exists). The guide''s limited-roster team with Diona: (Sandrone E, first rotation only) > Alyosha EQ > Diona hEQ > Sucrose ED N1 (Q) > Sandrone [combo]. Sandrone plays the guide''s C0 combo 3[C E] (Q), the burst after the first skill. Her build is the same in every Sandrone team except her ER substats: C0, A Teaspoon of Transcendence R1, 4pc Disenchantment in Deep Shadow, ATK%/ATK%/CRIT DMG, KQM-standard substats. This team is short of energy: no ER in the guide''s table (130-165% for +1 Cryo) lets her burst every rotation (at 166% she still skips or waits), so she follows the guide''s advice for that case: no ER beyond the standard''s (111%), burst when available. C0 Alyosha (no harvested team has him; from his KQM quick guide: Favonius Lance R3, 4pc Heart of the Furnace, ER/ATK%/CRIT Rate, 220.1% ER, inside the guide''s 195-225%) bursts when ready: even at 264% he waits for energy. C6 Diona (Favonius Warbow, 257.2% ER) from a harvested team, as in batch 2, bursts when ready. Sucrose from a harvested team bursts when ready, as the guide''s (Q) says. Every burst in the rotation therefore comes about every other rotation, and the looped score keeps only 79% of the one pass, which starts from full energy. Known problem: the fork''s calibration against HoYoLAB 46338256 is -11.9% for the team (Sandrone -16.7%, Yae Miko -16%, Escoffier +27%), cause unknown (docs/characters/sandrone.md §1).'

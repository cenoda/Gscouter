notes: 'Written from the KQM Sandrone quick guide (design §5.4; no community gcsim config with Sandrone exists). The guide''s example team 2 with Escoffier: Odette 2[E](Q) > Alyosha EQ > Escoffier (Q) E > Sandrone [combo]. Sandrone plays the guide''s C0 combo 3[C E] (Q), the burst after the first skill. Her build is the same in every Sandrone team except her ER substats: C0, A Teaspoon of Transcendence R1, 4pc Disenchantment in Deep Shadow, ATK%/ATK%/CRIT DMG, KQM-standard substats; 122% ER, the least in the guide''s table (+2 Cryo row, 120-140%) at which she bursts every rotation. C6 Alyosha (no harvested team has him; from his KQM quick guide: Favonius Lance R3, 4pc Heart of the Furnace as the Sandrone guide''s ideal gear here, ER/ATK%/CRIT Rate) is the only Electro member, so he bursts every rotation (bursting when ready cost about a quarter of the score) at 258.7% ER, the least that allows it; his guide gives 150-175%, but gcsim counts his skill''s particles off field (design §5.4, batch 3). Odette (C0, Finale of the Deep R5, from her KQM quick guide) wears 4pc Disenchantment in Deep Shadow, the guide''s ideal gear for this team, and bursts when ready (the guide: skip it before C4), about every other rotation. Escoffier as in the other Sandrone teams (Favonius Lance R3) at 174.7% ER, the least at which she bursts every rotation. Every burst but Odette''s comes every rotation, with energy waits under 0.2 s per minute. Known problem: the fork''s calibration against HoYoLAB 46338256 is -11.9% for the team (Sandrone -16.7%, Yae Miko -16%, Escoffier +27%), cause unknown (design §5.4, Sandrone row).'

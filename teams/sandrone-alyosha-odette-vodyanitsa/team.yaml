notes: 'Written from the KQM Sandrone quick guide (design §5.4; no community gcsim config with Sandrone exists). The guide''s example team 2 with Vodyanitsa: Odette 2[E](Q) > Alyosha EQ > Vodyanitsa E > Sandrone [combo]. Sandrone plays the guide''s C0 combo 3[C E] (Q), the burst after the first skill. Her build is the same in every Sandrone team except her ER substats: C0, A Teaspoon of Transcendence R1, 4pc Disenchantment in Deep Shadow, ATK%/ATK%/CRIT DMG, KQM-standard substats; 155.1% ER, the least in the guide''s table (+1 Cryo row, 130-165%) at which she bursts every rotation. C6 Alyosha (no harvested team has him; from his KQM quick guide: Favonius Lance R3, 4pc Heart of the Furnace as the Sandrone guide''s ideal gear here, ER/ATK%/CRIT Rate) is the only Electro member, so he bursts every rotation (bursting when ready cost about a quarter of the score) at 258.7% ER, the least that allows it; his guide gives 150-175%, but gcsim counts his skill''s particles off field (docs/characters/sandrone.md, batch 3). In this team even 264% leaves him short waits, which the score fills with his attacks; he still bursts every rotation. Odette (C0, Finale of the Deep R5, from her KQM quick guide) wears 4pc Disenchantment in Deep Shadow, the guide''s ideal gear for this team, and bursts when ready (the guide: skip it before C4), about every other rotation. Vodyanitsa (no harvested team has her; from her KQM quick guide: C0, Thrilling Tales R5, 4pc Tenacity of the Millelith, HP%/HP%/HP%, KQM-standard substats) uses only her skill, as the rotation says. Known problem: the fork''s calibration against HoYoLAB 46338256 is -11.9% for the team (Sandrone -16.7%, Yae Miko -16%, Escoffier +27%), cause unknown (docs/characters/sandrone.md §1).'

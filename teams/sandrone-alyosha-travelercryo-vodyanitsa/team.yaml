notes: 'Written from guides (design §5.4; no community gcsim config with Sandrone or Vodyanitsa exists: upstream gcsim lacks them). enjoygm lists Sandrone / Cryo Traveler / Yae or Alyosha / Vodyanitsa without a rotation (play Vodyanitsa "exactly as in the Vesna team: Skill, leave"). The rotation is the Sandrone / Alyosha / Odette / Vodyanitsa team''s (the KQM Sandrone quick guide''s example team 2 with Vodyanitsa, teams/sandrone-alyosha-odette-vodyanitsa, 182.2k looped) with the Cryo Traveler in Odette''s place, playing what the KQM Sandrone guide''s Stellar Swirl team gives her: Traveler E N1C Q > Alyosha EQ > Vodyanitsa E > Sandrone [combo], the Traveler skipping N1C Q on the first rotation (a let first flag). The Traveler bursts when ready (even 166% ER does not give a burst every rotation). Sandrone cannot burst every rotation at any ER in her guide''s table (+1 Cryo row, 130-165%; at 166% she still waits 0.6 s per minute), so she follows the guide''s advice for that case: 111% ER, the two freed rolls to ATK%, burst when available (146.0k looped against 133.0k at 155.1% and 132.2k at 166%). Alyosha (C6, Favonius Lance R3, 4pc Heart of the Furnace, 258.7% ER; bursts every rotation, the score filling short energy waits with his skill) and Vodyanitsa (Thrilling Tales R5, 4pc Tenacity, skill only) as in the base team; the Cryo Traveler the Sandrone Stellar Swirl team''s build (Exaiphanes Blade R1, 4pc Disenchantment in Deep Shadow; Alyosha holds Heart of the Furnace). Known problem: the fork''s calibration against HoYoLAB 46338256 is -11.9% for a Sandrone team, cause unknown (design §5.4, Sandrone row).'

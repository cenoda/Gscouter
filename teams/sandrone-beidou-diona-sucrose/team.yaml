notes: 'Written from the KQM Sandrone quick guide (design §5.4; no community gcsim config with Sandrone exists). The guide''s example team 5 with Sucrose: Beidou EQ > Diona hEQ > Sucrose ED N1 > Sandrone [combo]. Sandrone plays the guide''s C0 combo 3[C E] (Q), the burst after the first skill. Her build is the same in every Sandrone team except her ER substats: C0, A Teaspoon of Transcendence R1, 4pc Disenchantment in Deep Shadow, ATK%/ATK%/CRIT DMG, KQM-standard substats. This team is short of energy: no ER in the guide''s table (130-165% for +1 Cryo) lets her burst every rotation (at 166% she still skips or waits), so she follows the guide''s advice for that case: no ER beyond the standard''s (111%), burst when available. C6 Beidou (Favonius Greatsword, 194.4% ER) and C6 Diona (Favonius Warbow, 257.2% ER) from harvested teams, as in batch 2, burst when ready: Beidou''s 20 s cooldown is longer than the rotation, and Diona''s particles cannot fund her burst every rotation. Sucrose (Thrilling Tales R5) from a harvested team; the guide''s rotation has no Sucrose burst. Every burst in the rotation therefore comes about every other rotation, and the looped score keeps only 77% of the one pass, which starts from full energy. Known problem: the fork''s calibration against HoYoLAB 46338256 is -11.9% for the team (Sandrone -16.7%, Yae Miko -16%, Escoffier +27%), cause unknown (docs/characters/sandrone.md §1).'

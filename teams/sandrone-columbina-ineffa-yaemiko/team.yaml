notes: 'Written from the KQM Sandrone quick guide (design §5.4; no community gcsim config with Sandrone exists). The guide''s example team 6, its Lunar-Charged option: Yae Miko 3[E] > Columbina E > Ineffa E (Q) > Sandrone [combo], Ineffa bursting whenever available. Sandrone plays the guide''s C0 combo 3[C E] (Q), the burst after the first skill. Her build is the same in every Sandrone team except her ER substats: C0, A Teaspoon of Transcendence R1, 4pc Disenchantment in Deep Shadow, ATK%/ATK%/CRIT DMG, KQM-standard substats; she would need 155% ER to burst every rotation, above the table''s 120-140% for two Electro members, so she follows the guide''s advice for that case: no ER beyond the standard''s (111%), burst when available (every other rotation; 120.2k looped against 115.1k at 155% with a burst every rotation). Yae Miko as in every Sandrone team; Columbina (Sacrificial Jade R1, 4pc Tenacity of the Millelith) and Ineffa (Deathmatch R1, 4pc Aubade of Morningstar and Moon, burst when ready) from the harvested Flins / Ineffa / Columbina / Durin team. Known problem: the fork''s calibration against HoYoLAB 46338256 is -11.9% for the team (Sandrone -16.7%, Yae Miko -16%, Escoffier +27%), cause unknown (docs/characters/sandrone.md §1).'

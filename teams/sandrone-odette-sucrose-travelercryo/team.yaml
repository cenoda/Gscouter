notes: 'Written from the KQM Sandrone quick guide (design §5.4; no community gcsim config with Sandrone exists). The guide''s Stellar Swirl team: Odette 2[E](Q) > Sucrose N1 ED (Q) > Traveler E N1C Q > Sandrone C E > Sucrose N1 ED > Sandrone [combo], the Traveler skipping N1C Q on the first rotation (a let first flag). Sandrone plays the guide''s C0 combo 3[C E] (Q), the burst after the first skill. Her build is the same in every Sandrone team except her ER substats: C0, A Teaspoon of Transcendence R1, 4pc Disenchantment in Deep Shadow, ATK%/ATK%/CRIT DMG, KQM-standard substats; 122% ER, the least in the guide''s table (+2 Cryo row, 120-140%) at which she bursts every rotation. Odette as in the other Sandrone teams (C0, Finale of the Deep R5, 4pc Heart of the Furnace, 111% ER; burst when ready, about every other rotation). Sucrose as in the other Sandrone teams (C6, so her skill has two charges for the rotation''s two; burst when ready); the score fills her second skill''s cooldown with attacks. The Cryo Traveler has no KQM quick guide and no harvested team: C0, Exaiphanes Blade R1 (every guide''s first pick), 4pc Disenchantment in Deep Shadow (GenshinBuilds; AllThingsHow''s Heart of the Furnace is Odette''s here), ATK%/ATK%/CRIT DMG, KQM-standard substats, 111% ER; she bursts every rotation after the first. Known problem: the fork''s calibration against HoYoLAB 46338256 is -11.9% for the team (Sandrone -16.7%, Yae Miko -16%, Escoffier +27%), cause unknown (docs/characters/sandrone.md §1).'

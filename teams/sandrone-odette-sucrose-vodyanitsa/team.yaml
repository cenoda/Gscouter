notes: 'Written from guides (design §5.4; no community gcsim config with Sandrone or Vodyanitsa exists: upstream gcsim lacks them). LDShop, wishgm, enjoygm and Gaming ProMax list Sandrone / Odette / Sucrose / Vodyanitsa and AllThingsHow tested it at 247k; none gives a rotation (enjoygm: play Vodyanitsa "exactly as in the Vesna team: Skill, leave"). The rotation is the Sandrone / Odette / Sucrose / Cryo Traveler team''s (the KQM Sandrone quick guide''s Stellar Swirl team, teams/sandrone-odette-sucrose-travelercryo, 95.9k looped) with Vodyanitsa E in the Traveler''s place: Odette 2[E](Q) > Sucrose N1 ED (Q) > Vodyanitsa E > Sandrone C E > Sucrose N1 ED > Sandrone [combo], Odette and Sucrose bursting when ready. Sandrone''s build is the same in every Sandrone team except her ER substats: here 133.1%, the least in the guide''s table (+1 Cryo row, 130-165%) at which she bursts every rotation (122% almost does, with 0.2 s per minute of waits; 111% skips bursts and scores 112.6k). Odette and Sucrose as in the base team; Vodyanitsa from her KQM quick guide: C0, Prototype Amber R5 (Sucrose holds Thrilling Tales), 4pc Tenacity of the Millelith, HP%/HP%/HP%, skill only; she deals 0.5% of the damage. Known problem: the fork''s calibration against HoYoLAB 46338256 is -11.9% for a Sandrone team, cause unknown (docs/characters/sandrone.md §1).'

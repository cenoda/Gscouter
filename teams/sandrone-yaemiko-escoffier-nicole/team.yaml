notes: 'Written from the KQM Sandrone quick guide (design §5.4; no community gcsim config with Sandrone exists). The guide''s example team 4: Nicole E > Yae Miko 3[E] > Escoffier (Q) E > Sandrone [combo]. Sandrone plays the guide''s C0 combo 3[C E] (Q), the burst after the first skill, every rotation. Sandrone''s build is the same in every Sandrone team except her ER substats: C0, A Teaspoon of Transcendence R1, 4pc Disenchantment in Deep Shadow, ATK%/ATK%/CRIT DMG, KQM-standard substats, ER the least in the guide''s ER table at which she bursts every rotation (here 144.1%; the +1 Cryo row is 130-165%). Yae Miko as in every Sandrone team, from a harvested team. Escoffier as in the Lohen teams (Favonius Lance R3) with its own ER (147.1%): with no other Cryo member to feed her, she cannot burst every rotation at any ER her substats reach (186% skips every other burst), so she bursts when ready (every other rotation), as the guide allows here (her burst is optional, for healing). Nicole from a harvested team; the guide''s rotation has no Nicole burst. Sandrone bursts every rotation, with energy waits under 0.2 s per minute. Known problem: the fork''s calibration against HoYoLAB 46338256 is -11.9% for the team (Sandrone -16.7%, Yae Miko -16%, Escoffier +27%), cause unknown (design §5.4, Sandrone row).'

notes: 'Written from the KQM Sandrone quick guide (design §5.4; no community gcsim config with Sandrone exists). The guide''s example team 1 with Escoffier: Yae Miko 3[E] > Odette 2[E](Q) > Escoffier (Q) E > Sandrone [combo]. Odette bursts when ready (the guide: use it when available, or skip it before C4); with no ER beyond the standard''s she bursts about every other rotation. Sandrone plays the guide''s C0 combo 3[C E] (Q), the burst after the first skill as in the fork''s calibration, every rotation. Sandrone''s build is the same in every Sandrone team except her ER substats: C0, A Teaspoon of Transcendence R1, 4pc Disenchantment in Deep Shadow, ATK%/ATK%/CRIT DMG, KQM-standard substats, ER the least in the guide''s ER table at which she bursts every rotation (here 122%; the +2 Cryo row is 120-140%). Yae Miko from a harvested team; Odette (C0, Finale of the Deep R5, 4pc Heart of the Furnace, 111% ER) from her KQM quick guide with KQM-standard substats, as no library team has her. Escoffier as in the Lohen teams (Favonius Lance R3), at 174.7% ER, the least at which she bursts every rotation; with the Skirk team''s Deathmatch Escoffier she skips every other burst even at 166% ER, and that variant scored a few percent higher looped, so her burst is worth little here. Every burst in the rotation is cast every rotation, with energy waits under 0.2 s per minute. Known problem: the fork''s calibration against HoYoLAB 46338256 is -11.9% for the team (Sandrone -16.7%, Yae Miko -16%, Escoffier +27%), cause unknown (design §5.4, Sandrone row).'

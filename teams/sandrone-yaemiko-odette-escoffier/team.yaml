    note: 'In game, 209.1k on a level 100 dummy with 10% RES over 120 s, with other builds: C0 Sandrone with The Unforged R1 (here A Teaspoon of Transcendence R1), C1 Yae Miko (here C0), C0 Escoffier, C0 Odette, the post''s own artifacts; it gives no rotation. With those builds and conditions the fork gives 184.2k (-11.9%; design §5.4, Sandrone row, where the gap is a known problem). This team''s build under the common conditions scores 133.6k one pass (-36.1%) and 160.3k looped; the enemy is the same, so the difference is the builds (the post''s showcase artifacts against KQM-standard substats, its weapons and C1 Yae Miko) plus the fork''s known gap. Searched 2026-10-28: the KQM Sandrone quick guide (team list and rotations, no DPS, no gcsim links); the community gcsim database (no Sandrone: upstream gcsim lacks her); web searches for DPS figures, showcases and gcsim configs for this team (GenshinBuilds, GameWith, topuplist, AllThingsHow and fandomwire team pages: ratings and roles only; AllThingsHow''s tier list gives Sandrone 156.9k without a team or build).'

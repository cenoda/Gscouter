notes: 'Written from the KQM Sandrone quick guide (design §5.4; no community gcsim config with Sandrone exists). The guide''s example team 3 with Nicole: Nicole E > Yae Miko 3[E] > Qiqi E > Sandrone [combo]. Sandrone plays the guide''s C0 combo 3[C E] (Q), the burst after the first skill, every rotation. Sandrone''s build is the same in every Sandrone team except her ER substats: C0, A Teaspoon of Transcendence R1, 4pc Disenchantment in Deep Shadow, ATK%/ATK%/CRIT DMG, KQM-standard substats, ER the least in the guide''s ER table at which she bursts every rotation (here 144.1%; the +1 Cryo row is 130-165%). Yae Miko as in every Sandrone team, from a harvested team. Qiqi (C0, Favonius Sword, 4pc Scroll) from a harvested team; at C0 she skips her burst, as the guide''s rotation says. Nicole from a harvested team; the guide''s rotation has no Nicole burst. Sandrone bursts every rotation, with energy waits under 0.2 s per minute. Known problem: the fork''s calibration against HoYoLAB 46338256 is -11.9% for the team (Sandrone -16.7%, Yae Miko -16%, Escoffier +27%), cause unknown (docs/characters/sandrone.md §1).'

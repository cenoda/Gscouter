notes: 'Written from guides (design §5.4; no community gcsim config with Sandrone or Vodyanitsa exists: upstream gcsim lacks them). enjoygm lists Sandrone / Cryo Traveler / Yae or Alyosha / Vodyanitsa without a rotation (play Vodyanitsa "exactly as in the Vesna team: Skill, leave"). The rotation is the Sandrone / Yae Miko / Odette / Vodyanitsa team''s (the KQM Sandrone quick guide''s example team 1 with Vodyanitsa E, teams/sandrone-yaemiko-odette-vodyanitsa, 175.2k looped) with the Cryo Traveler in Odette''s place, playing what the KQM Sandrone guide''s Stellar Swirl team gives her: Yae 3[E] > Traveler E N1C Q > Vodyanitsa E > Sandrone [combo], the Traveler skipping N1C Q on the first rotation (a let first flag). The Traveler bursts when ready (even 166% ER does not give a burst every rotation, as in the Vesna teams). Sandrone cannot burst every rotation at any ER in her guide''s table (+1 Cryo row, 130-165%; at 166% she still waits), so she follows the guide''s advice for that case: 111% ER, the two freed rolls to ATK%, burst when available (130.4k looped against 117.6k at 160.6% and 120.1k at 166%). Yae Miko and Vodyanitsa (Thrilling Tales R5, 4pc Tenacity, skill only) as in the base team; the Cryo Traveler the Sandrone Stellar Swirl team''s build with 4pc Heart of the Furnace (no Odette holds it). Known problem: the fork''s calibration against HoYoLAB 46338256 is -11.9% for a Sandrone team, cause unknown (docs/characters/sandrone.md §1).'

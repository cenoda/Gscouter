notes: 'Written from guides (design §5.4; no community gcsim config with Vodyanitsa exists: upstream gcsim lacks her). AllThingsHow''s Skirk fourth-slot comparison plays Skirk / Escoffier / Vodyanitsa / Mona (Mona with Thrilling Tales, Vodyanitsa for healing, Hydro and RES shred, no Furina); LDShop calls Vodyanitsa an alternative to Mona or Citlali here. The Vodyanitsa guide''s Lohen team gives the order Vodyanitsa E > Escoffier E > Mona. The rotation and every other build are the harvested Skirk / Xingqiu / Mona / Escoffier team''s, with Vodyanitsa''s skill in place of Xingqiu''s, first as in that order; Vodyanitsa casts her skill, the last swap before the carry where she holds Thrilling Tales (Gaming ProMax: Vodyanitsa should be the last swap before Skirk with it), and bursts when ready (the guide: the burst is lowest priority; with 111% ER about every other rotation or less). Her healing keeps Furina''s Fanfare up where Furina is in the team. Skirk''s first-rotation burst opener is the source''s.'

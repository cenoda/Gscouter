notes: 'Written from guides (design §5.4; no community gcsim config with Vodyanitsa exists: upstream gcsim lacks her). enjoygm lists Skirk / Citlali / Furina / Vodyanitsa for when Escoffier is unavailable; LDShop and wishgm name Citlali as a substitute for Escoffier in Skirk / Furina / Escoffier / Vodyanitsa. The rotation and every other build are the harvested Skirk / Furina / Citlali / Escoffier team''s, with Vodyanitsa''s skill in place of Escoffier''s; Vodyanitsa casts her skill, the last swap before the carry where she holds Thrilling Tales (Gaming ProMax: Vodyanitsa should be the last swap before Skirk with it), and bursts when ready (the guide: the burst is lowest priority; with 111% ER about every other rotation or less). Her healing keeps Furina''s Fanfare up where Furina is in the team. Citlali holds Thrilling Tales and stays the last swap before Skirk.'

notes: 'Written from guides (design §5.4; no community gcsim config with Vodyanitsa exists: upstream gcsim lacks her). The KQM Vodyanitsa quick guide''s Skirk team (Furina ED N1 Q > Escoffier E(Q) > Vodyanitsa E(Q) > Skirk combo, one of Skirk''s best teammates in Pure Freeze); GenshinBuilds rates it SS, and GameWith, AllThingsHow, LDShop, enjoygm and Gaming ProMax list it as her Freeze team. The rotation and every other build are the harvested Skirk / Furina / Citlali / Escoffier team''s, with Vodyanitsa''s skill in place of Citlali''s (the Vodyanitsa guides compare her with Citlali and Mona for this slot); Vodyanitsa casts her skill, the last swap before the carry where she holds Thrilling Tales (Gaming ProMax: Vodyanitsa should be the last swap before Skirk with it), and bursts when ready (the guide: the burst is lowest priority; with 111% ER about every other rotation or less). Her healing keeps Furina''s Fanfare up where Furina is in the team. The opener drops the source''s swap back to Furina before Skirk (it waited for Furina''s Hydro before Citlali''s Cryo; Vodyanitsa applies Hydro herself).'

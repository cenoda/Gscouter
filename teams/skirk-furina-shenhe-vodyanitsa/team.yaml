notes: 'Written from guides (design §5.4; no community gcsim config with Vodyanitsa exists: upstream gcsim lacks her). LDShop and wishgm name Shenhe as a substitute for Escoffier in Skirk / Furina / Escoffier / Vodyanitsa (AllThingsHow lists the same Skirk team and says removing Escoffier costs damage). The rotation and every other build are the harvested Skirk / Furina / Shenhe / Escoffier team''s, with Vodyanitsa''s skill in place of Escoffier''s, moved after Shenhe''s so that she is the last swap before Skirk; Vodyanitsa casts her skill, the last swap before the carry where she holds Thrilling Tales (Gaming ProMax: Vodyanitsa should be the last swap before Skirk with it), and bursts when ready (the guide: the burst is lowest priority; with 111% ER about every other rotation or less). Her healing keeps Furina''s Fanfare up where Furina is in the team.'

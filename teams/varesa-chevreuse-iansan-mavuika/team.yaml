notes: 'Written from the community guides (design §5.4): the KQM Iansan quick guide gives Varesa ECP (first rotation) > Chevreuse Q hE > Iansan ECQ > Mavuika Q C2D E / EQ C2D > Varesa (ECP sQ) ECP ECP (sQ) ECP ECP (sQ) CP CP; the Varesa quick guide has the same order. The first rotation uses Mavuika Q C2D E and seven Varesa plunges, later ones EQ C2D and six. Varesa''s combo is in the gcsim form of the community config behind Varesa / Bennett / Mavuika / Chevreuse (db.kqm.gg), the same team with Bennett for Iansan. Build: Varesa, Chevreuse and Mavuika from that config (C0 Varesa and Mavuika, C6 Chevreuse); Iansan 4pc Noblesse, since Mavuika holds Scroll. Iansan C0 with Favonius Lance R3, KQM-standard substats and about 225% ER (the guide asks 180-210% with Favonius as the only Electro, less with a second one). Gcsim note: Iansan''s skill fills her Nightsoul points and drains them at 6 per second; her burst restores points from the active character''s movement only when the rotation reports a distance (movement()), which no source gives, so none is reported. Her burst buff therefore falls to its low-point rate a few seconds after her skill, and the score likely understates her.'

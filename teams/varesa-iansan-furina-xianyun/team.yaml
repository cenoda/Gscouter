notes: 'Written from the community guides (design §5.4): the KQM Iansan quick guide gives Furina ED Q > Iansan ECQ > Xianyun N1 EPQ > Varesa [combo], the Varesa quick guide the same with Varesa 2[ECP ECP (Q)] JP JP ECP (Q): seven plunges. Varesa''s combo is in the gcsim form of the community config behind Varesa / Ineffa / Furina / Xianyun (db.kqm.gg): ECP when her skill is ready, a jump plunge while Xianyun''s buff lasts, else CP, and her 30-energy burst after leaving Fiery Passion. Build: Varesa, Furina and Xianyun from that config (all C0); Iansan 4pc Scroll. Waits: the looped rotation sometimes skips Xianyun''s burst for energy. Iansan C0 with Favonius Lance R3, KQM-standard substats and about 225% ER (the guide asks 180-210% with Favonius as the only Electro, less with a second one). Movement: Iansan''s burst restores Nightsoul points from the active character''s movement, which gcsim counts only when the rotation reports it. The Iansan guide says Varesa "easily keeps Iansan''s Nightsoul points above 42 for the higher ATK buff", so every action reports movement at 9 m/s since the previous one, the lowest speed tried (6, 9, 12) above which the score stops rising: her higher ATK buff stays up. The speed stands for the guide''s statement, not a measurement.'

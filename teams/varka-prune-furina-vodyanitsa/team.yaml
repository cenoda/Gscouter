notes: 'Written from guides (design §5.4; no community gcsim config with Vodyanitsa exists: upstream gcsim lacks her). Varka / Prune / Furina / Vodyanitsa is GenshinBuilds'' SS Varka team for her, AllThingsHow''s tested 159k team, and on the enjoygm and wishgm lists (enjoygm: Vodyanitsa holds TTDS). No guide gives a rotation, so it is the harvested Varka / Prune / Mona / Furina team''s with Vodyanitsa''s skill in Mona''s place, already the last swap before Varka; she bursts when ready. Varka, Prune and Furina builds are that team''s. Vodyanitsa: C0, Thrilling Tales R5 (Mona held it in the source team), 4pc Scroll of the Hero of Cinder City (Furina holds Tenacity; the team swirls Hydro), HP%/HP%/HP%, KQM-standard substats, 111% ER. Furina waits 1.5 s/min for her skill cooldown: without Mona''s actions the rotation is shorter than her 20 s cooldown. The source team scores 116.2k looped (20 iterations); with Vodyanitsa for Mona this one is 7% lower.'

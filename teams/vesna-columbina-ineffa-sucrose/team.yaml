notes: 'Written from the GameWith Vesna team guide (design §5.4; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her; GameWith is the only guide found with a rotation for every team it lists, and Icy Veins'' ER table is used for Vesna). The guide''s Anemo on-field driver team (rated 1 of 5 stars): Ineffa E (Q when available) > Columbina E Q > Sucrose E > Vesna [combo], Vesna''s combo E [N C E]x2 Q E [N C E]x2; with the fork''s 5 Sword Essence per attack its 8 attacks pay for four Windborne Swords, so whenever the next one is not ready she keeps attacking until the fifth ends Armed for Action. Vesna is the same in every Vesna team except her ER and her set: C0, Beyond the Chrysalis R1, ATK%/ATK%/CRIT DMG, KQM-standard substats, here with 4pc Viridescent Venerer, the guide''s set for this team (without Cryo there is no Stellar Swirl for Scarlet Proof). She bursts every rotation from 116.5% ER; 122%, the bottom of Icy Veins'' row for a second Anemo member (120-140%), as the Sandrone batches raise ER to their table: 80.5k looped, against 79.9k at 111% with the burst when ready. Columbina (C0, Sacrificial Jade R1, 4pc Tenacity of the Millelith) and Ineffa (C0, Deathmatch R1, 4pc Aubade of Morningstar and Moon, 111% ER) from the harvested Flins / Ineffa / Columbina / Durin team, as in the Sandrone team with them; Ineffa bursts when available, as the guide says, and Columbina cannot burst every rotation at any ER her copied build reaches (at 182.7% she still waits 18 s per minute), so she bursts when ready. Sucrose (C6, Thrilling Tales R5, 4pc Instructor, the guide''s set here) from the harvested Alhaitham / Furina / Sucrose / Kuki Shinobu team; the guide''s rotation has no Sucrose burst. Vesna deals 18% of the damage, Ineffa and Columbina 81%. Known problems: every Vesna frame is estimated, and the published combos fit five Windborne Swords into 8 attacks where the fork''s data gives four (design §5.4, Added: Vesna).'

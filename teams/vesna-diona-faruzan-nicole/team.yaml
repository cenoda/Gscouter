notes: 'Written from published Vesna guides (docs/characters/vesna.md; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Diona E (hold) Q > Faruzan E C Q > Nicole E Q > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. The KQM Vodyanitsa quick guide also has C6 Faruzan replace Odette or the Cryo Traveler. No guide puts Nicole in a Stellar Swirl team; GameWith lists her as an ATK% buffer for Vesna''s Anemo driver team, so she takes a support slot here. Diona, Faruzan and Nicole burst when ready. Diona holds her skill (GameWith: tap or hold), which feeds her burst better. Faruzan''s C is her hold-mode aimed shot. Builds as in the other Vesna teams (build.txt). Faruzan holds Heart of the Furnace (its 4pc buff needs its holder to deal Stellar damage). Vesna''s ER is the best of the four tried (looped: 111% 87.3k, 122% 85.0k, 133% 82.8k, 144% 80.5k): 111%. 102.4k one pass, 87.3k looped (kept 85%); Vesna 85%, Diona 1%, Faruzan 13%, Nicole 0.8%. Known problems: every Vesna frame is estimated, and the published combos fit five Windborne Swords into 8 attacks where the fork''s data gives four (docs/characters/vesna.md).'

notes: 'Written from published Vesna guides (design §5.4, Added: Vesna; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Diona E (hold) Q > Faruzan E C Q > Sucrose E > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. The KQM Vodyanitsa quick guide also has C6 Faruzan replace Odette or the Cryo Traveler. Diona and Faruzan burst when ready. Diona holds her skill (GameWith: tap or hold), which feeds her burst better. Faruzan''s C is her hold-mode aimed shot. Sucrose uses only her skill, as in GameWith''s rotations. Builds as in the other Vesna teams (build.txt). Faruzan holds Heart of the Furnace (its 4pc buff needs its holder to deal Stellar damage). Vesna''s ER is the best of the four tried (looped: 111% 99.0k, 122% 96.3k, 133% 93.7k, 144% 91.0k): 111%. 106.3k one pass, 99.0k looped (kept 93%); Vesna 89%, Diona 0.7%, Faruzan 10%, Sucrose 0.6%. Known problems: every Vesna frame is estimated, and the published combos fit five Windborne Swords into 8 attacks where the fork''s data gives four (design §5.4, Added: Vesna).'

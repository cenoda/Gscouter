notes: 'Written from published Vesna guides (docs/characters/vesna.md; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Diona E (hold) Q > Lan Yan E Q > Nicole E > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. No guide puts Nicole in a Stellar Swirl team; GameWith lists her as an ATK% buffer for Vesna''s Anemo driver team, so she takes a support slot here. Diona and Lan Yan burst when ready. Diona holds her skill (GameWith: tap or hold), which feeds her burst better. Builds as in the other Vesna teams (build.txt). Lan Yan holds Heart of the Furnace (its 4pc buff needs its holder to deal Stellar damage). Vesna''s ER is the best of the four tried (looped: 111% 40.2k, 122% 39.0k, 133% 37.8k, 144% 35.9k): 111%. 71.8k one pass, 40.2k looped (kept 56%); Vesna 93%, Diona 2%, Lan Yan 3%, Nicole 3%. Nicole''s burst was dropped on 2026-10-29: its 1.9 s animation lengthened the cycle so that the end of Vesna''s combo fell outside the supports'' buffs. Looped score with build.txt 40.2k before, 46.7k without it; the numbers above are from before. Known problems: every Vesna frame is estimated (docs/characters/vesna.md).'

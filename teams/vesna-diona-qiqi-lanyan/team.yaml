notes: 'Written from published Vesna guides (design §5.4, Added: Vesna; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Diona E (hold) Q > Qiqi E Q > Lan Yan E Q > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. Diona, Qiqi and Lan Yan burst when ready. Diona holds her skill (GameWith: tap or hold), which feeds her burst better. Builds as in the other Vesna teams (build.txt). Lan Yan holds Heart of the Furnace (its 4pc buff needs its holder to deal Stellar damage). Vesna''s ER is the best of the four tried (looped: 111% 65.6k, 122% 63.5k, 133% 62.1k, 144% 63.4k): 111%. 78.7k one pass, 65.6k looped (kept 83%); Vesna 95%, Diona 1%, Qiqi 2%, Lan Yan 2%. Known problems: every Vesna frame is estimated, and the published combos fit five Windborne Swords into 8 attacks where the fork''s data gives four (design §5.4, Added: Vesna).'

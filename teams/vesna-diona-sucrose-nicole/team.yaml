notes: 'Written from published Vesna guides (docs/characters/vesna.md; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Diona E (hold) Q > Sucrose E > Nicole E > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. No guide puts Nicole in a Stellar Swirl team; GameWith lists her as an ATK% buffer for Vesna''s Anemo driver team, so she takes a support slot here. Diona bursts when ready. Diona holds her skill (GameWith: tap or hold), which feeds her burst better. Sucrose uses only her skill, as in GameWith''s rotations. Builds as in the other Vesna teams (build.txt). Sucrose holds Heart of the Furnace (its 4pc buff needs its holder to deal Stellar damage). Vesna''s ER is the best of the four tried (looped: 111% 80.8k, 122% 78.3k, 133% 75.8k, 144% 76.4k): 111%. 79.0k one pass, 69.9k looped (kept 88%); Vesna 93%, Diona 1%, Sucrose 3%, Nicole 2%. Nicole''s burst was dropped on 2026-10-29: its 1.9 s animation lengthened the cycle so that the end of Vesna''s combo fell outside the supports'' buffs. Looped score with build.txt 69.9k before, 75.8k without it; the numbers above are from before. Known problems: every Vesna frame is estimated (docs/characters/vesna.md).'

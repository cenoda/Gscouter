notes: 'Written from published Vesna guides (docs/characters/vesna.md; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Odette E E > Diona E (hold) Q > Faruzan E C Q > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. The KQM Vodyanitsa quick guide also has C6 Faruzan replace Odette or the Cryo Traveler. Diona and Faruzan burst when ready. Diona holds her skill (GameWith: tap or hold), which feeds her burst better. Faruzan''s C is her hold-mode aimed shot. Builds as in the other Vesna teams (build.txt). Odette holds Heart of the Furnace. Vesna''s ER is the best of the four tried (looped: 111% 141.1k, 122% 146.4k, 133% 145.4k, 144% 141.5k): 122%. 146.4k one pass, 154.3k looped (kept 105%); Vesna 78%, Odette 12%, Diona 0.6%, Faruzan 9%. Known problems: every Vesna frame is estimated (docs/characters/vesna.md).'

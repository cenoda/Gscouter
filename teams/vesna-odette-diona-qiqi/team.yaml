notes: 'Written from published Vesna guides (docs/characters/vesna.md; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Odette E E > Diona E (hold) Q > Qiqi E Q > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. Diona and Qiqi burst when ready. Diona holds her skill (GameWith: tap or hold), which feeds her burst better. Builds as in the other Vesna teams (build.txt). Odette holds Heart of the Furnace. Vesna''s ER is the best of the four tried (looped: 111% 121.2k, 122% 118.8k, 133% 116.3k, 144% 117.8k): 111%. 112.9k one pass, 120.7k looped (kept 107%); Vesna 82%, Odette 16%, Diona 0.6%, Qiqi 1%. Known problems: every Vesna frame is estimated (docs/characters/vesna.md).'

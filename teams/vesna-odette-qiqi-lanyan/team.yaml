notes: 'Written from published Vesna guides (docs/characters/vesna.md; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Odette E E > Qiqi E Q > Lan Yan E Q > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. Qiqi and Lan Yan burst when ready. Builds as in the other Vesna teams (build.txt). Odette holds Heart of the Furnace. Vesna''s ER is the best of the four tried (looped: 111% 98.5k, 122% 95.8k, 133% 93.1k, 144% 90.7k): 111%. 103.3k one pass, 98.5k looped (kept 95%); Vesna 80%, Odette 18%, Qiqi 2%, Lan Yan 0.8%. Known problems: every Vesna frame is estimated (docs/characters/vesna.md).'

notes: 'Written from published Vesna guides (docs/characters/vesna.md; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Odette E E > Cryo Traveler E N1C Q > Nicole E Q > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. No guide puts Nicole in a Stellar Swirl team; GameWith lists her as an ATK% buffer for Vesna''s Anemo driver team, so she takes a support slot here. Cryo Traveler and Nicole burst when ready. gcsim needs a normal attack before the Traveler''s charged attack. Builds as in the other Vesna teams (build.txt). Odette holds Heart of the Furnace. Vesna''s ER is the best of the four tried (looped: 111% 114.1k, 122% 111.2k, 133% 108.4k, 144% 105.7k): 111%. 101.5k one pass, 114.1k looped (kept 112%); Vesna 74%, Odette 16%, the Traveler 9%, Nicole 1%. Known problems: every Vesna frame is estimated, and the published combos fit five Windborne Swords into 8 attacks where the fork''s data gives four (docs/characters/vesna.md).'

notes: 'Written from the GameWith Vesna team guide (design §5.4; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). GameWith is the only guide found that gives a rotation for every team it lists; Icy Veins lists eight teams but gives rotations for two (this one, with the supports in the same order, and a Faruzan variant), AllThingsHow one F2P rotation; Icy Veins'' ER table is used for Vesna. The guide''s premium Stellar Swirl team: Odette E E > Traveler E C Q > Vodyanitsa E > Vesna [combo], Vesna''s combo E [N C E]x2 Q E [N C E]x2. Its 8 attacks summon 12 wind pinions (two with each Charged Attack), 60 Sword Essence, so with the skill''s 60 and the burst''s 30 they pay for all five Windborne Swords; when the burst or the next sword is not ready she keeps attacking (the guide: use Normal and Charged Attacks to recharge it) until the fifth ends Armed for Action. gcsim needs a normal attack before the Traveler''s charged attack (E N1C Q). Vesna is the same in every Vesna team except her ER and, in the Anemo driver team, her set: C0, Beyond the Chrysalis R1, 4pc Scarlet Proof (the guide''s), ATK%/ATK%/CRIT DMG (the guide: CRIT Rate or DMG; CRIT DMG scored 7% higher), KQM-standard substats. Here she cannot burst every rotation at any ER the substats reach (at 166.1% she still waits 1.1 s per minute; Icy Veins gives 150-170% without a second Anemo), so she follows the usual advice for a main DPS: 111% ER, burst when ready (150.5k looped, against 146.9k at 166.1% with her burst every rotation). Odette as in the Sandrone teams (C0, Finale of the Deep R5, 4pc Heart of the Furnace, from her KQM quick guide; the guide gives her Whitelake Frostfeather); the guide''s rotation has no Odette burst. The Cryo Traveler as in the Sandrone Stellar Swirl team (C0, Exaiphanes Blade R1, 4pc Disenchantment in Deep Shadow; the guide gives her Noblesse Oblige) cannot burst every rotation even at 166.1% (3.6 s per minute of waits) and bursts when ready at 111%. Vodyanitsa as in the Sandrone team with her (C0, Thrilling Tales R5, 4pc Tenacity of the Millelith, from her KQM quick guide; the guide gives her Hymn of the Maelstrom) uses only her skill, as the guide says. Known problems: every Vesna frame is estimated (docs/characters/vesna.md).'

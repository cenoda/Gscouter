notes: 'Written from published Vesna guides (docs/characters/vesna.md; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Qiqi E Q > Faruzan E C Q > Lan Yan E Q > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. The KQM Vodyanitsa quick guide also has C6 Faruzan replace Odette or the Cryo Traveler. Qiqi, Faruzan and Lan Yan burst when ready. Faruzan''s C is her hold-mode aimed shot. Builds as in the other Vesna teams (build.txt). Faruzan holds Heart of the Furnace (its 4pc buff needs its holder to deal Stellar damage). Vesna''s ER is the best of the four tried (looped: 111% 84.0k, 122% 82.0k, 133% 80.3k, 144% 78.5k): 111%. 80.7k one pass, 84.0k looped (kept 104%); Vesna 84%, Qiqi 2%, Faruzan 12%, Lan Yan 2%. Known problems: every Vesna frame is estimated (docs/characters/vesna.md). Since 2026-10-29 (fork 9104976, two wind pinions per Charged Attack) Vesna''s combo is shorter and Diona or Faruzan no longer gets her burst back every rotation, so Vesna adds 3 N C pairs after her burst: looped 77.6k without, 72.3k with 1, 78.3k with 2, 79.9k with 3, 76.9k with 4.'

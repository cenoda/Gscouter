notes: 'Written from published Vesna guides (docs/characters/vesna.md; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Qiqi E Q > Faruzan E C Q > Sucrose E > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. The KQM Vodyanitsa quick guide also has C6 Faruzan replace Odette or the Cryo Traveler. Qiqi and Faruzan burst when ready. Faruzan''s C is her hold-mode aimed shot. Sucrose uses only her skill, as in GameWith''s rotations. Builds as in the other Vesna teams (build.txt). Faruzan holds Heart of the Furnace (its 4pc buff needs its holder to deal Stellar damage). Vesna''s ER is the best of the four tried (looped: 111% 102.2k, 122% 99.5k, 133% 96.8k, 144% 94.1k): 111%. 97.8k one pass, 102.2k looped (kept 105%); Vesna 87%, Qiqi 2%, Faruzan 11%, Sucrose 0.7%. Known problems: every Vesna frame is estimated (docs/characters/vesna.md).'

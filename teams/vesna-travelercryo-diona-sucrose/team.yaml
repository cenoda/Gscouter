notes: 'Written from the GameWith Vesna team guide (design §5.4; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her; GameWith is the only guide found with a rotation for every team it lists, and Icy Veins'' ER table is used for Vesna). The guide''s F2P Stellar Swirl team: Traveler E C Q > Diona E Q > Sucrose E > Vesna [combo], Vesna''s combo E [N C E]x2 Q E [N C E]x2; with the burst its 8 attacks pay for all five Windborne Swords (5 Sword Essence per wind pinion, two with each Charged Attack); when the burst or the next sword is not ready she keeps attacking until the fifth ends Armed for Action. gcsim needs a normal attack before the Traveler''s charged attack (E N1C Q). Vesna is the same in every Vesna team except her ER: C0, Beyond the Chrysalis R1 (the guide names Emberwell or Finale of the Deep for this F2P team), 4pc Scarlet Proof, ATK%/ATK%/CRIT DMG, KQM-standard substats; 138.6% ER, the least at which she bursts every rotation, inside Icy Veins'' row for a second Anemo member (120-140%): 76.5k looped, against 71.9k at 111% with the burst when ready. The Cryo Traveler (no KQM quick guide, no harvested team) as in the Sandrone Stellar Swirl team (C0, Exaiphanes Blade R1, ATK%/ATK%/CRIT DMG, 111% ER) but with 4pc Heart of the Furnace, the guide''s set for her here, where no Odette holds it. C6 Diona (Favonius Warbow R4, 4pc Noblesse Oblige, 257.2% ER, from a harvested team) and Sucrose (C6, Thrilling Tales R5, 4pc Viridescent Venerer, from a harvested team) as in the Sandrone teams. The Traveler (166.1% still waits 22 s per minute) and Diona (at 257.2% still 15 s per minute) cannot burst every rotation at any ER the substats reach, so both burst when ready; the guide''s rotation has no Sucrose burst. Known problems: every Vesna frame is estimated (docs/characters/vesna.md). Rechecked on 2026-10-29 with two wind pinions per Charged Attack (fork 9104976): 111% now scores highest (looped 111% 85.1k, 122% 82.7k, 133% 81.2k, 138.6% 81.7k, 144% 82.5k), so she has 111%; the ER above is from before.'

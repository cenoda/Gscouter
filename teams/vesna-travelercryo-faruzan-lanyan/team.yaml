notes: 'Written from published Vesna guides (docs/characters/vesna.md; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Cryo Traveler E N1C Q > Faruzan E C Q > Lan Yan E Q > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. The KQM Vodyanitsa quick guide also has C6 Faruzan replace Odette or the Cryo Traveler. Cryo Traveler, Faruzan and Lan Yan burst when ready. Faruzan''s C is her hold-mode aimed shot. gcsim needs a normal attack before the Traveler''s charged attack. Builds as in the other Vesna teams (build.txt). Cryo Traveler holds Heart of the Furnace (its 4pc buff needs its holder to deal Stellar damage). Vesna''s ER is the best of the four tried (looped: 111% 74.6k, 122% 70.7k, 133% 68.8k, 144% 67.1k): 111%. 64.5k one pass, 67.3k looped (kept 104%); Vesna 74%, the Traveler 11%, Faruzan 12%, Lan Yan 3%. Known problems: every Vesna frame is estimated (docs/characters/vesna.md).'

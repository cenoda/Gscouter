notes: 'Written from published Vesna guides (docs/characters/vesna.md; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Cryo Traveler E N1C Q > Qiqi E Q > Sucrose E > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. Cryo Traveler and Qiqi burst when ready. gcsim needs a normal attack before the Traveler''s charged attack. Sucrose uses only her skill, as in GameWith''s rotations. Builds as in the other Vesna teams (build.txt). Cryo Traveler holds Heart of the Furnace (its 4pc buff needs its holder to deal Stellar damage). Vesna''s ER is the best of the four tried (looped: 111% 88.4k, 122% 89.0k, 133% 89.9k, 144% 88.2k): 133%. 74.0k one pass, 87.6k looped (kept 118%); Vesna 88%, the Traveler 10%, Qiqi 2%, Sucrose 0.7%. Known problems: every Vesna frame is estimated (docs/characters/vesna.md).'

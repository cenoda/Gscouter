notes: 'Written from published Vesna guides (design §5.4, Added: Vesna; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). GameWith Vesna team guide, F2P Stellar Swirl team (Traveler E C Q > Diona E Q > Sucrose E > Vesna combo) with Vodyanitsa for Sucrose (a substitute it lists) and Nicole in the Cryo Traveler''s slot; the guide lists Nicole only as an ATK% buffer for Vesna''s Anemo driver team: Diona E (hold) Q > Nicole E Q > Vodyanitsa E > Vesna combo. Diona and Nicole burst when ready. Diona holds her skill (the guide: tap or hold), which feeds her burst better. Vesna''s combo as in every Vesna team (GameWith''s E [N C E]x2 Q E [N C E]x2). Builds as in the other Vesna teams (build.txt); Vesna at the standard''s 111% ER, which scored higher than 122% and 133% here. 113.3k one pass, 62.5k looped; Vesna 94%, Diona 2%, Nicole 2%, Vodyanitsa 2%. Diona is the only Cryo member and, with no Favonius holder beside her, bursts in only 11 of 22 rotations even holding her skill; without her burst Vodyanitsa''s Hydro takes over (143 Hydro Swirls against 66 Stellar Swirls in one run), so the looped score keeps 55% of the one pass from full energy. Known problems: every Vesna frame is estimated, and the published combos fit five Windborne Swords into 8 attacks where the fork''s data gives four (design §5.4, Added: Vesna).'

notes: 'Written from published Vesna guides (docs/characters/vesna.md; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Diona E (hold) Q > Nicole E > Vodyanitsa E > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. No guide puts Nicole in a Stellar Swirl team; GameWith lists her as an ATK% buffer for Vesna''s Anemo driver team, so she takes a support slot here. Diona bursts when ready. Diona holds her skill (GameWith: tap or hold), which feeds her burst better. Builds as in the other Vesna teams (build.txt). No member holds Heart of the Furnace: none but Odette, the Cryo Traveler and the Anemo supports deals Stellar damage to trigger it. Vesna''s ER is the best of the four tried (looped: 111% 73.1k, 122% 70.9k, 133% 68.7k, 144% 66.2k): 111%. 102.6k one pass, 64.0k looped (kept 62%); Vesna 94%, Diona 2%, Nicole 2%, Vodyanitsa 2%. Nicole''s burst was dropped on 2026-10-29: its 1.9 s animation lengthened the cycle so that the end of Vesna''s combo fell outside the supports'' buffs. Looped score with build.txt 64.0k before, 67.3k without it; the numbers above are from before. Known problems: every Vesna frame is estimated (docs/characters/vesna.md).'

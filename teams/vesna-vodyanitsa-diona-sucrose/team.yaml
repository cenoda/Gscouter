notes: 'Written from published Vesna guides (docs/characters/vesna.md; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Diona E (hold) Q > Sucrose E > Vodyanitsa E > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. Diona burst when ready. Diona holds her skill (GameWith: tap or hold), which feeds her burst better. Sucrose uses only her skill, as in GameWith''s rotations. Builds as in the other Vesna teams (build.txt). Sucrose holds Heart of the Furnace (its 4pc buff needs its holder to deal Stellar damage). Vesna''s ER is the best of the four tried (looped: 111% 97.4k, 122% 93.0k, 133% 97.2k, 144% 95.1k): 111%. 120.1k one pass, 97.4k looped (kept 81%); Vesna 96%, Diona 0.7%, Sucrose 3%, Vodyanitsa 0.8%. Known problems: every Vesna frame is estimated (docs/characters/vesna.md).'

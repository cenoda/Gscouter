notes: 'Written from published Vesna guides (design §5.4, Added: Vesna; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). GameWith Vesna team guide, Anemo on-field driver team (Ineffa E Q > Columbina E Q > Sucrose E > Vesna combo), the guide''s only team without Cryo, with its listed substitutes Faruzan and Nicole for Sucrose and Vodyanitsa in a support slot; no guide lists this team: Faruzan E C Q > Nicole E Q > Vodyanitsa E > Vesna combo. Faruzan''s C is her hold-mode aimed shot. Faruzan and Nicole burst when ready. Vesna''s combo as in every Vesna team (GameWith''s E [N C E]x2 Q E [N C E]x2). Builds as in the other Vesna teams (build.txt); Vesna at the standard''s 111% ER, which scored higher than 122% and 133% here. 37.1k one pass, 28.9k looped; Vesna 77%, Faruzan 15%, Vodyanitsa 6%, Nicole 2%. With no Cryo member there is no Stellar Swirl: Vesna swirls Vodyanitsa''s Hydro and Nicole''s Pyro. Kept for completeness, as a team a player can field. Known problems: every Vesna frame is estimated, and the published combos fit five Windborne Swords into 8 attacks where the fork''s data gives four (design §5.4, Added: Vesna).'

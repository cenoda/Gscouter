notes: 'Written from published Vesna guides (design §5.4, Added: Vesna; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). GameWith Vesna team guide, premium Stellar Swirl team (Odette E E > Traveler E C Q > Vodyanitsa E > Vesna combo) with Diona for the Cryo Traveler, a substitute it lists: Odette E E > Diona E (hold) Q > Vodyanitsa E > Vesna combo. Diona bursts when ready. Diona holds her skill (the guide: tap or hold), which feeds her burst better. Vesna''s combo as in every Vesna team (GameWith''s E [N C E]x2 Q E [N C E]x2). Builds as in the other Vesna teams (build.txt); Vesna at the standard''s 111% ER, which scored higher than 122% and 133% here. 175.0k one pass, 152.4k looped; Vesna 85%, Odette 15%, Diona 0.4%, Vodyanitsa 0.5%. Tapping Diona''s skill instead scores 0.3% higher, within noise; every Diona team holds it. Known problems: every Vesna frame is estimated, and the published combos fit five Windborne Swords into 8 attacks where the fork''s data gives four (design §5.4, Added: Vesna).'

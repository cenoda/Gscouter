notes: 'Written from published Vesna guides (docs/characters/vesna.md; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Qiqi E Q > Lan Yan E Q > Vodyanitsa E > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. Qiqi and Lan Yan burst when ready. Builds as in the other Vesna teams (build.txt). Lan Yan holds Heart of the Furnace (its 4pc buff needs its holder to deal Stellar damage). Vesna''s ER is the best of the four tried (looped: 111% 100.9k, 122% 97.9k, 133% 94.8k, 144% 91.8k): 111%. 95.0k one pass, 87.0k looped (kept 92%); Vesna 96%, Qiqi 2%, Lan Yan 0.9%, Vodyanitsa 0.8%. Known problems: every Vesna frame is estimated (docs/characters/vesna.md).'

notes: 'Written from published Vesna guides (docs/characters/vesna.md; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Qiqi E Q > Nicole E Q > Vodyanitsa E > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. No guide puts Nicole in a Stellar Swirl team; GameWith lists her as an ATK% buffer for Vesna''s Anemo driver team, so she takes a support slot here. Qiqi and Nicole burst when ready. Builds as in the other Vesna teams (build.txt). No member holds Heart of the Furnace: none but Odette, the Cryo Traveler and the Anemo supports deals Stellar damage to trigger it. Vesna''s ER is the best of the four tried (looped: 111% 105.2k, 122% 102.0k, 133% 98.9k, 144% 102.3k): 111%. 98.3k one pass, 102.1k looped (kept 104%); Vesna 95%, Qiqi 2%, Nicole 2%, Vodyanitsa 0.8%. Known problems: every Vesna frame is estimated (docs/characters/vesna.md).'

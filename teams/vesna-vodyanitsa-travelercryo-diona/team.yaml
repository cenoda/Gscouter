notes: 'Written from published Vesna guides (docs/characters/vesna.md; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Written in the order of the GameWith Vesna team guide''s Stellar Swirl rotations (Cryo supports, then the other supports, then Vesna''s combo): Cryo Traveler E N1C Q > Diona E (hold) Q > Vodyanitsa E > Vesna combo. GameWith''s Stellar Swirl teams are Vesna / Odette / Cryo Traveler / Vodyanitsa and Vesna / Cryo Traveler / Diona / Sucrose; for the Cryo slots it lists Odette, the Cryo Traveler, Diona and Qiqi, and for the fourth slot Vodyanitsa, Faruzan, Sucrose, Lan Yan and Qiqi. Cryo Traveler and Diona burst when ready. Diona holds her skill (GameWith: tap or hold), which feeds her burst better. gcsim needs a normal attack before the Traveler''s charged attack. Builds as in the other Vesna teams (build.txt). Cryo Traveler holds Heart of the Furnace (its 4pc buff needs its holder to deal Stellar damage). Vesna''s ER is the best of the four tried (looped: 111% 107.9k, 122% 104.8k, 133% 101.6k, 144% 100.7k): 111%. 108.5k one pass, 107.9k looped (kept 99%); Vesna 90%, the Traveler 9%, Diona 0.6%, Vodyanitsa 0.7%. Known problems: every Vesna frame is estimated (docs/characters/vesna.md).'

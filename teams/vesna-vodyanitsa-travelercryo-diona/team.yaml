notes: 'Written from published Vesna guides (design §5.4, Added: Vesna; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). GameWith Vesna team guide, F2P Stellar Swirl team (Traveler E C Q > Diona E Q > Sucrose E > Vesna combo) with Vodyanitsa for Sucrose, a substitute it lists: Traveler E N1C Q > Diona E (hold) Q > Vodyanitsa E > Vesna combo. gcsim needs a normal attack before the Traveler''s charged attack. The Traveler and Diona burst when ready. Diona holds her skill (the guide: tap or hold), which feeds her burst better. Vesna''s combo as in every Vesna team (GameWith''s E [N C E]x2 Q E [N C E]x2). Builds as in the other Vesna teams (build.txt); Vesna at the standard''s 111% ER, which scored higher than 122% and 133% here. 108.5k one pass, 107.9k looped; Vesna 90%, the Traveler 9%, Diona 0.6%, Vodyanitsa 0.7%. Known problems: every Vesna frame is estimated, and the published combos fit five Windborne Swords into 8 attacks where the fork''s data gives four (design §5.4, Added: Vesna).'

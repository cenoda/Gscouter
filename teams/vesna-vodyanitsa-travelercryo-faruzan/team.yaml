notes: 'Written from the KQM Vodyanitsa quick guide (design §5.4; no KQM Vesna quick guide exists, and no community gcsim config with Vesna can exist while upstream gcsim lacks her). Its Vesna team is Vodyanitsa / Vesna / Odette / Cryo Traveler (Odette Q/E E > Cryo Traveler E N1C Q > Vodyanitsa E > Vesna combo), and it says: "If one of Odette or Cryo Traveler is unavailable, C6 Faruzan can be a decent replacement for them", with a rotation for the Odette / Faruzan variant (Faruzan E C Q > Odette 2[E] > Vodyanitsa E > Vesna combo). This team replaces Odette with Faruzan, played as in that variant: Faruzan E C Q > Cryo Traveler E N1C Q > Vodyanitsa E > Vesna combo, Faruzan''s C her hold-mode aimed shot; Faruzan and the Traveler burst when ready. The guide does not spell out Vesna''s combo, so she plays the one of every Vesna team (GameWith''s E [N C E]x2 Q E [N C E]x2; whenever the next Windborne Sword is not ready she keeps attacking until the fifth ends Armed for Action). Vesna as in every Vesna team except her ER: C0, Beyond the Chrysalis R1, 4pc Scarlet Proof, ATK%/ATK%/CRIT DMG, 122% ER (Icy Veins: 100-120% with C6 Faruzan, 120-140% with a second Anemo member), bursting in 18 of about 20 rotations: 116.6k looped, against 109.3k at 111% and 116.9k at 127.5%. The Cryo Traveler (C0, Exaiphanes Blade R1) wears 4pc Heart of the Furnace as in the F2P Vesna team (the guide: one teammate should hold it; no Odette does here). Vodyanitsa as in the other Vesna teams (C0, TTDS R5, 4pc Tenacity of the Millelith), skill only. Faruzan with the most common C6 Faruzan build of the harvested library teams (Favonius Warbow R4, 4pc Viridescent Venerer, ATK%/Anemo DMG/CRIT Rate); her burst comes in 11 of about 21 rotations, and 22% more ER adds 0.6%. Vesna deals 83% of the damage, the Traveler 9%, Faruzan 7%, Vodyanitsa 0.6% (her value is her buffs). Known problems: every Vesna frame is estimated, and the published combos fit five Windborne Swords into 8 attacks where the fork''s data gives four (docs/characters/vesna.md). Mobalytics and Prydwen (search extracts; both pages return 403) warn that Vodyanitsa next to Faruzan lowers Stellar Swirl triggers; the guides rank this team below the ones with Odette.'

notes: 'Written from the KQM Vodyanitsa quick guide (design §5.4; no community gcsim config with Vodyanitsa exists: upstream gcsim lacks her), its Stellar Swirl team with Mizuki, rotation as written: Vodyanitsa E > Odette Q/E E > Traveler E N1C Q > Mizuki E (Q). Footnotes: Odette bursts every other rotation from the second on, otherwise skill (an odq toggle; on her rotation she bursts if ready: at 111% she manages about half of those, and more ER only lowers her damage, her burst replacing a skill); the Traveler casts only her skill on the first rotation (a let first flag), E N1C Q after, her burst when ready because its 15 s cooldown is longer than the 14.7 s rotation (every other rotation at any ER); Mizuki bursts whenever available. Mizuki''s combo and build are the harvested Yumemizuki Mizuki / Ineffa / Columbina / Ororon team''s (E, burst when ready during Dreamdrifter, then a charged attack; Evenstar R1, 4pc Viridescent Venerer). Odette (Finale of the Deep R5, 4pc Heart of the Furnace, the guide''s holder) and the Cryo Traveler (Exaiphanes Blade R1, 4pc Disenchantment in Deep Shadow) as in the Sandrone Stellar Swirl team; Vodyanitsa from her KQM quick guide: C0, Thrilling Tales R5 (the guide: passed to Odette or the Traveler with Mizuki; Odette is her next swap), 2pc Tenacity + 2pc Vourukasha''s Glow (the guide''s mix where the main damage dealer does not scale with ATK), HP%/HP%/HP%, skill only. Kept is above 130%: the one pass is the guide''s first rotation, without the Traveler''s N1C Q and Odette''s burst and with Mizuki''s Stellar Swirls not yet built up; three rotations from full energy score 75.2k, 91% of the looped score.'

notes: 'Written from the community guide (design §5.4): the Zibai quick guide lists Zibai / Illuga / Linnea / Aino, Yelan or Xingqiu, with the rotation Linnea (N1) E > Aino EQ > Illuga Q E > Zibai combo. Aino and Illuga burst when ready. Build at the level of Zibai / Linnea / Columbina / Gorou (same Zibai and Linnea builds). Spirit Steed''s Stride needs 70 Phase Shift Radiance; Zibai attacks until she has it. Illuga C0, Favonius Lance R3 (the guide''s pick when ER is tight), 2pc Gilded Dreams + 2pc Wanderer''s Troupe (the guide''s 2pc EM + 2pc EM; 4pc Silken Moon''s Serenade needs his C2), ER/EM/EM, 204% ER: he bursts every rotation (the guide asks 185% at C0). Aino C0, Favonius Greatsword R3, 4pc Silken Moon''s Serenade (the guide''s build), ER/EM/CRIT. Aino deals 0.4% of the damage herself (validation warns): she is the Hydro applier for Lunar-Crystallize and the Moonsign. Without Columbina the team scores far below the Columbina teams. Waits: none above 2 s/min, no energy waits. Fork notes: Linnea''s burst is left out (the guides use it only for healing), because on the fork a burst while Lumi is out stops Lumi''s attacks; Linnea''s A4 EM buff is not refreshed on swap. Zibai, Illuga and Aino are upstream characters.'

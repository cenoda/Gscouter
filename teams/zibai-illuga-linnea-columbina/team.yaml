notes: 'Written from the community guide (design §5.4): the Zibai quick guide''s first team, Zibai / Illuga / Linnea / Columbina, with its first listed rotation (Super Rot, Hybrid Mode Linnea): Linnea (N1) E > Columbina EQ > Illuga Q E > Zibai full combo (E, 4[N4 E], N1 Q after an E when the burst is ready). Columbina and Illuga burst when ready. Build at the level of Zibai / Linnea / Columbina / Gorou (same Zibai and Linnea builds, C2 Columbina with her signature and 4pc Aubade). Spirit Steed''s Stride needs 70 Phase Shift Radiance; Zibai attacks until she has it. Illuga C0, Favonius Lance R3 (the guide''s pick when ER is tight), 2pc Gilded Dreams + 2pc Wanderer''s Troupe (the guide''s 2pc EM + 2pc EM; 4pc Silken Moon''s Serenade needs his C2), ER/EM/EM, 204% ER: he bursts every rotation (the guide asks 185% at C0). Waits: none above 2 s/min, no energy waits; Columbina bursts in about 9 rotations of 10. Fork notes: Linnea''s burst is left out (the guides use it only for healing), because on the fork a burst while Lumi is out stops Lumi''s attacks; Linnea''s A4 EM buff is not refreshed on swap. Zibai, Illuga and Columbina are upstream characters.'
cross_check:
    note: 'No public number for this exact team (searched 2026-10-27: the KQM Zibai and Illuga quick guides (no DPS numbers), the community gcsim database (no entry with Zibai, Linnea or Illuga), web search (only unsourced build-site figures)). The design notes (docs/characters/first-batches.md) give 214.9k one pass for this team with an earlier, unrecorded Illuga build; this one, at 204% ER, is 207.6k. For scale: Zibai / Linnea / Columbina / Gorou, same Zibai, Linnea and Columbina builds, is 235.9k one pass and 252.4k looped; the Korean community reports about 200k for C0 Zibai with C2 Columbina in Zibai / Illuga / Columbina + Zhongli or Gorou (arca.live 161869688).'

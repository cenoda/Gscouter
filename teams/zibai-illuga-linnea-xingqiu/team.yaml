notes: 'Written from the community guide (design §5.4): the Zibai quick guide lists Zibai / Illuga / Linnea / Aino, Yelan or Xingqiu, with the rotation Linnea (N1) E > Xingqiu ED (Q N1) > Illuga Q E > Zibai combo. Xingqiu and Illuga burst when ready. Build at the level of Zibai / Linnea / Columbina / Gorou (same Zibai and Linnea builds). Spirit Steed''s Stride needs 70 Phase Shift Radiance; Zibai attacks until she has it. Illuga C0, Favonius Lance R3 (the guide''s pick when ER is tight), 2pc Gilded Dreams + 2pc Wanderer''s Troupe (the guide''s 2pc EM + 2pc EM; 4pc Silken Moon''s Serenade needs his C2), ER/EM/EM, 204% ER: he bursts every rotation (the guide asks 185% at C0). Xingqiu C6, Favonius Sword R3, 4pc Silken Moon''s Serenade (the guide''s build), ER/Hydro/CRIT. Waits: the rotation is about 19 s, under Xingqiu''s 21 s skill cooldown, so the looped rotation waits about 4 s/min for his skill (validation warns); the guide''s footnote gives Sacrificial Sword, with his burst every other rotation, to shorten it. No energy waits. Fork notes: Linnea''s burst is left out (the guides use it only for healing), because on the fork a burst while Lumi is out stops Lumi''s attacks; Linnea''s A4 EM buff is not refreshed on swap. Zibai, Illuga and Xingqiu are upstream characters.'

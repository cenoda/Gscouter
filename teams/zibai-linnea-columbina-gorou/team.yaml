notes: 'Written from the community guides (design §5.4): the Linnea quick guide lists Zibai / Linnea / Columbina / Gorou or Illuga first; Gorou is taken since Illuga needs 185% ER at C0 and the guides call C6 Gorou close to him. Rotation from the Zibai quick guide: Columbina E (Q) > Linnea (N1) E > Gorou (Q) E > Zibai full combo (E, 4[N4 E], N1 Q after an E when the burst is ready). Spirit Steed''s Stride needs 70 Phase Shift Radiance; Zibai attacks until she has it (she had it after every N4 in the check). Build at the level of the community numbers (cross_check): Zibai Lightbearing Moonshard R1, 4pc NotSU, DEF/DEF/CRIT, artifacts well above KQM standard; C2 Columbina with Nocturne''s Curtain Call R1, 4pc Aubade, ER/HP/CRIT; Linnea Slingshot R5, 4pc Husk; C6 Gorou Favonius Warbow R3, 4pc SMS. With 4-star weapons, C0 Columbina and KQM-standard artifacts the same rotation scores 137.6k one pass. Gorou bursts every other rotation, as the guides say. Waits: none above 2 s/min, no energy waits. Fork notes: Linnea''s burst is left out (the guides use it only for healing), because on the fork a burst while Lumi is out stops Lumi''s attacks; Linnea''s A4 EM buff is not refreshed on swap. Zibai, Columbina and Gorou are upstream characters.'
cross_check:
    note: 'Korean community (arca.live 161869688, via search results; the page itself returns 403): Zibai about 200k at C0 and 240k at C1, all with C2 Columbina and her signature, in Zibai / Illuga / Columbina + Zhongli or Gorou. One rotation here: 235.9k at C0, 252.4k looped. Not the same team (Linnea instead of Illuga), so for scale only. The Linnea guide also allows Illuga for Gorou; with the same builds Zibai / Illuga / Linnea / Columbina scored 214.5k one pass, lower than this team, though the community ranks Illuga higher (C0 Illuga, possibly a rotation or implementation gap, not investigated).'

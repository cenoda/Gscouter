notes: 'Written from the community guide (design §5.4): the Zibai quick guide lists Zibai / Linnea / Gorou or Xilonen / Columbina, with the rotation Columbina E (Q) > Xilonen > Linnea (N1) E or 5[E] > Zibai combo. Xilonen plays E N2 (her Nightsoul kicks, as in the guide''s other Xilonen teams); the guide uses her burst only when healing is needed, so it is left out. Linnea plays Super Mode, (N1) E. Build at the level of Zibai / Linnea / Columbina / Gorou (same Zibai and Linnea builds, C2 Columbina with her signature and 4pc Aubade). Spirit Steed''s Stride needs 70 Phase Shift Radiance; Zibai attacks until she has it. Xilonen C0, Favonius Sword R3, 4pc Scroll of the Hero of Cinder City (the guide''s build), DEF/DEF/CRIT. Waits: none above 2 s/min, no energy waits. Fork notes: Linnea''s burst is left out (the guides use it only for healing), because on the fork a burst while Lumi is out stops Lumi''s attacks; Linnea''s A4 EM buff is not refreshed on swap. Zibai, Xilonen and Columbina are upstream characters.'
